<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SaaS Backoffice Admin AMR</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co.com/gMmSSTgq/IMG-20260606-WA0000.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tautkan ke Manifest khusus Admin -->
    <link rel="manifest" href="./manifest-admin.json">
    
    <style>
        button, input, select { touch-action: manipulation; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; }
        .hidden-screen { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-card:active { transform: scale(0.95); opacity: 0.8; }
        .fade-out { animation: fadeOut 0.5s forwards; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        #menu-container { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col select-none text-slate-100 overflow-hidden">

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 bg-[#020617] z-[150] flex flex-col items-center justify-center smooth-transition">
        <img src="https://i.ibb.co.com/gMmSSTgq/IMG-20260606-WA0000.jpg" alt="Loading" class="w-48 animate-pulse mb-4">
        <p class="text-slate-300 text-sm font-semibold tracking-widest animate-bounce">MEMUAT BACKOFFICE ADMIN...</p>
    </div>

    <!-- 2. SCREEN AKTIVASI (FIX: Ditambahkan langsung untuk mencegah blank hitam di komputer baru) -->
    <div id="activation-screen" class="hidden-screen fixed inset-0 bg-slate-950 z-[110] flex items-center justify-center p-4 smooth-transition">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-md p-8 text-center">
            <img src="https://i.ibb.co.com/gMmSSTgq/IMG-20260606-WA0000.jpg" class="w-24 h-24 mx-auto mb-4">
            <h2 class="text-2xl font-bold text-white mb-2">Aktivasi Backoffice</h2>
            <p class="text-xs text-slate-400 mb-6">Masukkan URL API dari MRD Solution</p>
            <input type="url" id="api-input" placeholder="Masukkan URL API..." class="w-full px-4 py-3 bg-slate-950 border-2 border-slate-800 text-white rounded-xl focus:border-amber-500 outline-none mb-4 text-sm text-center smooth-transition">
            <button onclick="activateAdminSystem()" id="btn-activate" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl smooth-transition shadow-lg">Aktifkan Backoffice</button>
        </div>
    </div>

    <!-- 3. SCREEN LOGIN ADMIN (PIN TERPROTEKSI) -->
    <div id="login-screen" class="hidden-screen fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4 smooth-transition">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-sm p-8 text-center">
            <img src="https://i.ibb.co.com/gMmSSTgq/IMG-20260606-WA0000.jpg" class="w-20 h-20 mx-auto mb-4">
            <h2 id="login-resto-name" class="text-xl font-black text-amber-500 mb-6 uppercase tracking-widest">AMR ADMIN</h2>
            <h3 class="text-2xl font-bold text-white mb-2">Otorisasi Atasan</h3>
            <p class="text-xs text-slate-400 mb-6">Masukkan PIN Atasan (Manager/Owner/HRD)</p>
            
            <div class="flex gap-4 justify-center mb-8">
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
            </div>

            <input type="password" id="login-pin" class="hidden-screen">

            <div class="grid grid-cols-3 gap-4 w-full max-w-xs mx-auto mb-4 text-white">
                <button onclick="pressNum('1')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">1</button>
                <button onclick="pressNum('2')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">2</button>
                <button onclick="pressNum('3')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">3</button>
                <button onclick="pressNum('4')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">4</button>
                <button onclick="pressNum('5')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">5</button>
                <button onclick="pressNum('6')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">6</button>
                <button onclick="pressNum('7')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">7</button>
                <button onclick="pressNum('8')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">8</button>
                <button onclick="pressNum('9')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">9</button>
                <button onclick="clearPin()" class="h-14 rounded-2xl bg-red-950/40 text-red-500 font-bold text-sm active:scale-95 smooth-transition">CLEAR</button>
                <button onclick="pressNum('0')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">0</button>
                <button onclick="backspacePin()" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-lg active:scale-95 smooth-transition flex items-center justify-center text-amber-500"><i data-lucide="delete" class="w-6 h-6"></i></button>
            </div>
            
            <button onclick="resetLicense()" class="text-[10px] text-red-500 mt-6 hover:underline uppercase font-bold tracking-wider">Hapus Sesi & Reset</button>
        </div>
    </div>

    <!-- 4. MAIN DASHBOARD APPLICATION LAYOUT -->
    <div id="main-app" class="hidden-screen h-full w-full flex flex-col md:flex-row bg-[#020617] overflow-hidden smooth-transition">
        
        <!-- SIDEBAR KIRI (DESKTOP) & NAV ATAS (MOBILE) -->
        <aside class="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex flex-row md:flex-col justify-between p-4 shrink-0 z-20">
            <div class="flex flex-row md:flex-col items-center md:items-start gap-4 md:w-full">
                <div class="flex items-center gap-3">
                    <img src="https://i.ibb.co.com/gMmSSTgq/IMG-20260606-WA0000.jpg" class="w-8 h-8 rounded-lg">
                    <h1 class="text-md font-black text-amber-500 tracking-tight uppercase">AMR SaaS</h1>
                </div>

                <nav class="hidden md:flex flex-col gap-1.5 w-full mt-6">
                    <button onclick="switchTab('Users')" id="nav-Users" class="nav-btn w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3 bg-amber-500 text-slate-950 transition">
                        <i data-lucide="users" class="w-4 h-4"></i> <span>Data Karyawan</span>
                    </button>
                    <button onclick="switchTab('Menu')" id="nav-Menu" class="nav-btn w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition">
                        <i data-lucide="utensils" class="w-4 h-4"></i> <span>Data Menu</span>
                    </button>
                    <button onclick="switchTab('Promo')" id="nav-Promo" class="nav-btn w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition">
                        <i data-lucide="ticket" class="w-4 h-4"></i> <span>Diskon & Voucher</span>
                    </button>
                    <button onclick="switchTab('Reports')" id="nav-Reports" class="nav-btn w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition">
                        <i data-lucide="bar-chart-3" class="w-4 h-4"></i> <span>Laporan Harian</span>
                    </button>
                </nav>
            </div>

            <div class="flex items-center gap-3 md:w-full md:border-t border-slate-800 md:pt-4">
                <div class="hidden md:block flex-1 min-w-0 text-left">
                    <p id="admin-name" class="text-xs font-black text-white truncate">-</p>
                    <p id="admin-role" class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">-</p>
                </div>
                <button onclick="logoutAdmin()" class="p-2 bg-rose-500/10 text-rose-500 rounded-lg hover:bg-rose-500/20 transition" title="Logout Sesi Admin">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </aside>

        <!-- CONTAINER UTAMA KONTEN -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-950">
            <div class="md:hidden flex gap-2 overflow-x-auto p-4 bg-slate-900 border-b border-slate-800 no-scrollbar">
                <button onclick="switchTab('Users')" id="mob-nav-Users" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-amber-500 text-slate-950">Karyawan</button>
                <button onclick="switchTab('Menu')" id="mob-nav-Menu" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Menu</button>
                <button onclick="switchTab('Promo')" id="mob-nav-Promo" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Promo</button>
                <button onclick="switchTab('Reports')" id="mob-nav-Reports" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Laporan</button>
            </div>

            <div id="content-area" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
        </main>
    </div>

    <!-- MODAL FORM INPUT -->
    <div id="modal-form" class="hidden-screen fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 smooth-transition">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h3 id="modal-title" class="text-md font-black text-amber-500 uppercase tracking-wider">-</h3>
                <button onclick="closeModal('modal-form')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="modal-form-body" class="flex-1 overflow-y-auto space-y-4 pr-1 text-left"></div>
            <div class="mt-6 pt-4 border-t border-slate-800 flex justify-end gap-2 shrink-0">
                <button onclick="closeModal('modal-form')" class="px-5 py-2.5 text-xs font-bold text-slate-400 hover:text-white transition">Batal</button>
                <button id="btn-save-form" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs rounded-xl shadow-lg transition">SIMPAN DATA</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA KONTROL ADMIN -->
    <script>
        const STORAGE_API = "MRD_API_URL";
        let GAS_URL = localStorage.getItem(STORAGE_API);
        const STORAGE_ADMIN = "MRD_ADMIN_SESSION";

        let currentTab = "Users";
        let adminInfo = null;
        let loginPinValue = "";

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('splash-screen').classList.add('hidden-screen');
                    checkAdminState();
                }, 500);
            }, 1000);
        };

        function checkAdminState() {
            // FIX: Alihkan ke layar aktivasi alih-alih redirect kasar ke index.html
            if (!GAS_URL) {
                showScreen('activation-screen');
                return;
            }

            try {
                adminInfo = JSON.parse(localStorage.getItem(STORAGE_ADMIN));
            } catch(e) {
                localStorage.removeItem(STORAGE_ADMIN);
            }

            if (!adminInfo) {
                showScreen('login-screen');
                clearPin();
            } else {
                showScreen('main-app');
                document.getElementById('admin-name').innerText = adminInfo.name;
                document.getElementById('admin-role').innerText = adminInfo.role;
                switchTab(currentTab);
            }
        }

        // --- SISTEM AKTIVASI SISTEM BACKOFFICE ---
        async function activateAdminSystem() {
            const input = document.getElementById('api-input').value.trim();
            if(!input) return alert("Masukkan URL!");
            const btn = document.getElementById('btn-activate');
            btn.innerHTML = "Loading...";
            
            try {
                const res = await fetch(input, { method: 'POST', body: JSON.stringify({ action: 'getConfig' }) });
                const json = await res.json();
                if(json.success) {
                    localStorage.setItem(STORAGE_API, input);
                    GAS_URL = input; // Setel token global aktif
                    window.location.reload();
                } else throw new Error("Gagal");
            } catch (e) {
                alert("URL API tidak valid!");
                btn.innerHTML = "Aktifkan Backoffice";
            }
        }

        // --- SISTEM NUMPAD PIN ---
        function pressNum(num) {
            if(loginPinValue.length < 4) {
                loginPinValue += num;
                updateLoginDots();
                if(loginPinValue.length === 4) setTimeout(loginAdmin, 300);
            }
        }

        function backspacePin() {
            if(loginPinValue.length > 0) {
                loginPinValue = loginPinValue.slice(0, -1);
                updateLoginDots();
            }
        }

        function clearPin() {
            loginPinValue = "";
            updateLoginDots();
        }

        function updateLoginDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, idx) => {
                if(idx < loginPinValue.length) { 
                    dot.classList.add('bg-amber-500', 'border-amber-500'); 
                    dot.classList.remove('bg-transparent', 'border-slate-600'); 
                } else { 
                    dot.classList.remove('bg-amber-500', 'border-amber-500'); 
                    dot.classList.add('bg-transparent', 'border-slate-600'); 
                }
            });
        }

        async function loginAdmin() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'loginPOS', data: { pin: loginPinValue } }) });
                const json = await res.json();
                if(json.success) {
                    const allowedRoles = ["admin", "hrd", "manager", "owner"];
                    const roleClean = json.role ? json.role.toLowerCase().trim() : "";

                    if (allowedRoles.includes(roleClean)) {
                        localStorage.setItem(STORAGE_ADMIN, JSON.stringify(json));
                        window.location.reload();
                    } else {
                        alert("Akses Ditolak! Hanya untuk tingkat Jabatan Manager, HRD, dan Owner.");
                        clearPin();
                    }
                } else {
                    alert(json.message || "PIN Salah!");
                    clearPin();
                }
            } catch(e) {
                alert("Koneksi gagal!");
                clearPin();
            }
        }

        function logoutAdmin() {
            if (confirm("Keluar dari sesi administrator saat ini?")) {
                localStorage.removeItem(STORAGE_ADMIN);
                window.location.reload();
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition";
            });
            const activeBtn = document.getElementById(`nav-${tabName}`);
            if (activeBtn) activeBtn.className = "nav-btn w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3 bg-amber-500 text-slate-950 transition";

            document.querySelectorAll('.mob-nav-btn').forEach(btn => {
                btn.className = "mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400";
            });
            const activeMobBtn = document.getElementById(`mob-nav-${tabName}`);
            if (activeMobBtn) activeMobBtn.className = "mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-amber-500 text-slate-950";

            renderContent(tabName);
        }

        function renderContent(tab) {
            const area = document.getElementById('content-area');
            if (!area) return;

            const userRole = adminInfo.role ? adminInfo.role.toLowerCase().trim() : "";

            if (tab === "Users" && userRole === "manager") {
                area.innerHTML = `<div class="py-20 text-center text-rose-500 font-bold text-xs"><i data-lucide="shield-alert" class="w-12 h-12 mx-auto mb-3"></i>AKSES DITOLAK! Manajemen Karyawan hanya boleh diakses oleh Owner dan HRD.</div>`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }
            if (tab === "Promo" && (userRole === "hrd" || userRole === "manager")) {
                area.innerHTML = `<div class="py-20 text-center text-rose-500 font-bold text-xs"><i data-lucide="shield-alert" class="w-12 h-12 mx-auto mb-3"></i>AKSES DITOLAK! Pengaturan Diskon & Voucher hanya boleh dikelola oleh Owner.</div>`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            area.innerHTML = `
                <div class="flex justify-between items-center shrink-0 border-b border-slate-800 pb-4 animate-slide-up">
                    <div class="text-left">
                        <h2 class="text-xl font-black text-white uppercase tracking-wider">${tab} Management</h2>
                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">Kelola data ${tab} cabang ${adminInfo.area}</p>
                    </div>
                    <button onclick="openFormModal('${tab}')" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-black rounded-xl shadow-lg flex items-center gap-1.5 transition">
                        <i data-lucide="plus" class="w-4 h-4"></i> TAMBAH DATA
                    </button>
                </div>
                <div class="py-20 text-center text-slate-600 animate-pulse text-xs">Menarik data dari database Google Sheets...</div>
            `;
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function openFormModal(tab) {
            document.getElementById('modal-title').innerText = `Tambah Data ${tab}`;
            const body = document.getElementById('modal-form-body');
            
            if (tab === "Users") {
                body.innerHTML = `
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Nama Lengkap</label>
                        <input type="text" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-amber-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Role (Atasan/Staff)</label>
                            <select class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 outline-none text-xs text-white focus:border-amber-500">
                                <option value="Staff">Staff</option>
                                <option value="Manager">Manager</option>
                                <option value="HRD">HRD</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Jobdesk Kerja</label>
                            <select class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 outline-none text-xs text-white focus:border-amber-500">
                                <option value="Pelayan">Pelayan</option>
                                <option value="Kasir">Kasir</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">PIN Login (4 Angka)</label>
                        <input type="password" maxlength="4" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs text-center font-black focus:border-amber-500">
                    </div>
                `;
            } else if (tab === "Menu") {
                body.innerHTML = `
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Nama Menu Kuliner</label>
                        <input type="text" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-amber-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Harga Jual (Selling Price)</label>
                            <input type="number" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Rute Printer</label>
                            <select class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 outline-none text-xs text-white focus:border-amber-500">
                                <option value="Kitchen">Dapur (Kitchen)</option>
                                <option value="Bar">Bar (Drinks)</option>
                            </select>
                        </div>
                    </div>
                `;
            } else {
                body.innerHTML = `<p class="text-xs text-slate-500">Form untuk ${tab} sedang dalam proses inisialisasi...</p>`;
            }

            openFormModalShow();
        }

        function openFormModalShow() {
            openModal('modal-form');
        }
    </script>
</body>
</html>
