<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SaaS Backoffice Admin AMR</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/JW1FFbCz/1780229137561.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest-admin.json">
    <style>
        button, input, select { touch-action: manipulation; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; }
        .hidden-screen { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .fade-out { animation: fadeOut 0.5s forwards; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* =========================================================================
         * OVERRIDE TEMA TERANG SAAS (LIGHT MODE)
         * ========================================================================= */
        body.light-mode {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-mode #splash-screen {
            background-color: #f1f5f9;
        }
        body.light-mode #activation-screen,
        body.light-mode #login-screen {
            background-color: #e2e8f0;
        }
        body.light-mode #activation-screen > div,
        body.light-mode #login-screen > div {
            background-color: #ffffff;
            border-color: #cbd5e1;
            color: #0f172a;
        }
        body.light-mode #activation-screen h2,
        body.light-mode #login-screen h3,
        body.light-mode #activation-screen p,
        body.light-mode #login-screen p {
            color: #1e293b;
        }
        body.light-mode #api-input {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #0f172a;
        }
        body.light-mode #main-app {
            background-color: #f8fafc;
        }
        body.light-mode aside {
            background-color: #ffffff;
            border-color: #cbd5e1;
        }
        body.light-mode main {
            background-color: #f8fafc;
        }
        body.light-mode .nav-btn:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        body.light-mode .nav-btn:not(.bg-slate-800\/80):not(.bg-amber-500) {
            color: #475569;
        }
        body.light-mode #admin-name {
            color: #0f172a;
        }
        body.light-mode .submenu-container button {
            color: #475569;
        }
        body.light-mode .submenu-container button:hover {
            background-color: #f1f5f9;
        }
        body.light-mode .pin-dot {
            border-color: #94a3b8;
        }
        body.light-mode .bg-slate-800 {
            background-color: #e2e8f0;
            color: #0f172a;
        }
        body.light-mode .bg-slate-800:hover {
            background-color: #cbd5e1;
        }
        body.light-mode .bg-slate-900 {
            background-color: #ffffff;
            border-color: #cbd5e1;
        }
        body.light-mode .mob-nav-btn {
            background-color: #e2e8f0;
            color: #475569;
        }
        body.light-mode .mob-nav-btn.bg-amber-500 {
            background-color: #f59e0b;
            color: #0f172a;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col select-none text-slate-100 overflow-hidden">

    <!-- EKSEKUSI TEMA AWAL SEBELUM HALAMAN SELESAI RENDERING (MENCEGAH KEDIPAN FLASH) -->
    <script>
        const storedTheme = localStorage.getItem("MRD_ADMIN_THEME") || "dark";
        if (storedTheme === "light") {
            document.body.classList.add("light-mode");
        }
    </script>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 bg-[#020617] z-[150] flex flex-col items-center justify-center smooth-transition">
        <img src="https://i.ibb.co.com/R4ZYj74K/1780229303550.png" alt="Loading" class="w-48 animate-pulse mb-4">
        <p class="text-slate-300 text-sm font-semibold tracking-widest animate-bounce">MEMUAT BACKOFFICE ADMIN...</p>
    </div>

    <!-- 2. SCREEN AKTIVASI -->
    <div id="activation-screen" class="hidden-screen fixed inset-0 bg-slate-950 z-[110] flex items-center justify-center p-4 smooth-transition">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-md p-8 text-center">
            <img src="https://i.ibb.co.com/JW1FFbCz/1780229137561.png" class="w-24 h-24 mx-auto mb-4">
            <h2 class="text-2xl font-bold text-white mb-2">Aktivasi Backoffice</h2>
            <p class="text-xs text-slate-400 mb-6">Masukkan URL API GAS Deploy milik Anda</p>
            <input type="url" id="api-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-4 py-3 bg-slate-950 border-2 border-slate-800 text-white rounded-xl focus:border-amber-500 outline-none mb-4 text-sm text-center smooth-transition">
            <button onclick="activateAdminSystem()" id="btn-activate" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl smooth-transition shadow-lg">Aktifkan Backoffice</button>
        </div>
    </div>

    <!-- 3. SCREEN LOGIN ADMIN -->
    <div id="login-screen" class="hidden-screen fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4 smooth-transition">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-sm p-8 text-center">
            <img src="https://i.ibb.co.com/JW1FFbCz/1780229137561.png" class="w-20 h-20 mx-auto mb-4">
            <h2 id="login-resto-name" class="text-xl font-black text-amber-500 mb-6 uppercase tracking-widest">AMR ADMIN</h2>
            <h3 class="text-2xl font-bold text-white mb-2">Otorisasi Atasan</h3>
            <p class="text-xs text-slate-400 mb-6">Masukkan PIN Atasan (Manager/Owner/HRD/Admin)</p>
            
            <div class="flex gap-4 justify-center mb-8">
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
            </div>

            <input type="password" id="login-pin" class="hidden-screen">

            <div class="grid grid-cols-3 gap-4 w-full max-w-xs mx-auto mb-4 text-white">
                <button onclick="pressNum('1')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">1</button>
                <button onclick="pressNum('2')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">2</button>
                <button onclick="pressNum('3')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">3</button>
                <button onclick="pressNum('4')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">4</button>
                <button onclick="pressNum('5')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">5</button>
                <button onclick="pressNum('6')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">6</button>
                <button onclick="pressNum('7')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">7</button>
                <button onclick="pressNum('8')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">8</button>
                <button onclick="pressNum('9')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">9</button>
                <button onclick="clearPin()" class="h-16 rounded-2xl bg-red-950/40 text-red-500 font-bold text-sm active:scale-95 smooth-transition">CLEAR</button>
                <button onclick="pressNum('0')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-xl active:scale-95 smooth-transition">0</button>
                <button onclick="backspacePin()" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-lg active:scale-95 smooth-transition flex items-center justify-center text-amber-500"><i data-lucide="delete" class="w-6 h-6"></i></button>
            </div>
            
            <button onclick="resetLicense()" class="text-[10px] text-red-500 mt-6 hover:underline uppercase font-bold tracking-wider">Hapus Sesi & Reset</button>
        </div>
    </div>

    <!-- 4. MAIN DASHBOARD APPLICATION LAYOUT -->
    <div id="main-app" class="hidden-screen h-full w-full flex flex-col md:flex-row bg-[#020617] overflow-hidden smooth-transition">
        
        <!-- SIDEBAR KIRI -->
        <aside class="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex flex-row md:flex-col justify-between p-4 shrink-0 z-20">
            <div class="flex flex-row md:flex-col items-center md:items-start gap-4 md:w-full">
                <div class="flex items-center gap-3">
                    <img src="https://lh3.googleusercontent.com/d/1ZXs1pIaPk7EjfcGIu5rew4qO9kQXoNlF" class="w-8 h-8 rounded-lg object-cover">
                    <h1 class="text-md font-black text-amber-500 tracking-tight uppercase">AMR Backoffice</h1>
                </div>

                <nav class="hidden md:flex flex-col gap-2.5 w-full mt-6">
                    <!-- SUB-MENU GROUP 1: MANAJEMEN HRD -->
                    <div id="group-hrd" class="w-full border-b border-slate-800 pb-2">
                        <button onclick="toggleHrdMenu()" class="w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center justify-between text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <div class="flex items-center gap-3">
                                <i data-lucide="users" class="w-4 h-4 text-amber-500"></i>
                                <span>Manajemen HRD</span>
                            </div>
                            <i data-lucide="chevron-down" id="hrd-chevron" class="w-4 h-4 transition-transform duration-200"></i>
                        </button>
                        <div id="hrd-submenu" class="hidden pl-6 mt-1 flex flex-col gap-1 w-full submenu-container">
                            <button onclick="switchTab('Users')" id="nav-Users" class="nav-btn w-full px-4 py-2.5 rounded-xl text-[11px] font-bold flex items-center gap-2 text-slate-400 hover:bg-slate-850 hover:text-white transition">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> <span>Daftar Karyawan</span>
                            </button>
                            <button onclick="switchTab('Attendance')" id="nav-Attendance" class="nav-btn w-full px-4 py-2.5 rounded-xl text-[11px] font-bold flex items-center gap-2 text-slate-400 hover:bg-slate-850 hover:text-white transition">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> <span>Rekap Absensi</span>
                            </button>
                        </div>
                    </div>

                    <!-- MENU UTAMA TOP-LEVEL -->
                    <button onclick="switchTab('Menu')" id="nav-Menu" class="nav-btn w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition">
                        <i data-lucide="utensils" class="w-4 h-4 text-indigo-400"></i> <span>Data Menu</span>
                    </button>
                    <button onclick="switchTab('Promo')" id="nav-Promo" class="nav-btn w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition">
                        <i data-lucide="ticket" class="w-4 h-4 text-rose-400"></i> <span>Diskon & Voucher</span>
                    </button>

                    <!-- SUB-MENU GROUP 2: LAPORAN PENJUALAN -->
                    <div id="group-reports" class="w-full border-t border-b border-slate-800 py-2">
                        <button onclick="toggleReportMenu()" class="w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center justify-between text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            <div class="flex items-center gap-3">
                                <i data-lucide="bar-chart-3" class="w-4 h-4 text-emerald-500"></i>
                                <span>Laporan Penjualan</span>
                            </div>
                            <i data-lucide="chevron-down" id="report-chevron" class="w-4 h-4 transition-transform duration-200"></i>
                        </button>
                        <div id="report-submenu" class="hidden pl-6 mt-1 flex flex-col gap-1 w-full submenu-container">
                            <button onclick="switchTab('ProdSales')" id="nav-ProdSales" class="nav-btn w-full px-4 py-2.5 rounded-xl text-[11px] font-bold flex items-center gap-2 text-slate-400 hover:bg-slate-850 hover:text-white transition">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> <span>Penjualan Item</span>
                            </button>
                            <button onclick="switchTab('AuditSales')" id="nav-AuditSales" class="nav-btn w-full px-4 py-2.5 rounded-xl text-[11px] font-bold flex items-center gap-2 text-slate-400 hover:bg-slate-850 hover:text-white transition">
                                <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> <span>Rekonsiliasi & Audit</span>
                            </button>
                        </div>
                    </div>

                    <button onclick="switchTab('Config')" id="nav-Config" class="nav-btn w-full px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition">
                        <i data-lucide="settings" class="w-4 h-4 text-slate-400"></i> <span>Pengaturan Sistem</span>
                    </button>
                </nav>
            </div>

            <!-- Identitas Admin Logged-In & Tombol Kontrol Bawah -->
            <div class="flex items-center justify-between gap-3 md:w-full md:border-t border-slate-800 md:pt-4">
                <div class="hidden md:block flex-1 min-w-0 text-left">
                    <p id="admin-name" class="text-xs font-black text-white truncate">-</p>
                    <p id="admin-role" class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">-</p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <button id="btn-install-pwa" onclick="triggerPwaInstall()" class="hidden-screen p-2 bg-emerald-500/10 text-emerald-400 rounded-lg hover:bg-emerald-400 hover:text-slate-950 transition" title="Instal Aplikasi Desktop">
                        <i data-lucide="download" class="w-4 h-4 animate-bounce"></i>
                    </button>
                    <button onclick="toggleTheme()" class="p-2 bg-slate-800 hover:bg-slate-700 text-amber-500 rounded-lg transition" title="Ubah Tema">
                        <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
                    </button>
                    <button onclick="logoutAdmin()" class="p-2 bg-rose-500/10 text-rose-500 rounded-lg hover:bg-rose-500/20 transition" title="Logout Sesi Admin">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- AREA KONTEN UTAMA -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-950">
            <div class="md:hidden flex gap-2 overflow-x-auto p-4 bg-slate-900 border-b border-slate-800 no-scrollbar">
                <button onclick="switchTab('Users')" id="mob-nav-Users" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Karyawan</button>
                <button onclick="switchTab('Attendance')" id="mob-nav-Attendance" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Absensi</button>
                <button onclick="switchTab('Menu')" id="mob-nav-Menu" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Menu</button>
                <button onclick="switchTab('Promo')" id="mob-nav-Promo" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Promo</button>
                <button onclick="switchTab('ProdSales')" id="mob-nav-ProdSales" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Laporan Produk</button>
                <button onclick="switchTab('AuditSales')" id="mob-nav-AuditSales" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Audit</button>
                <button onclick="switchTab('Config')" id="mob-nav-Config" class="mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400">Pengaturan</button>
            </div>

            <div id="content-area" class="flex-1 overflow-y-auto p-6"></div>
        </main>
    </div>

    <script>
        const STORAGE_API = "MRD_API_URL";
        const STORAGE_ADMIN = "MRD_ADMIN_SESSION";
        
        let GAS_URL = localStorage.getItem(STORAGE_API);
        let adminInfo = null;
        let loginPinValue = "";
        let currentTab = "Users";

        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('fade-out');
                    setTimeout(() => {
                        splash.classList.add('hidden-screen');
                        checkAdminState();
                        updateThemeIcon(); 
                    }, 500);
                }
            }, 1000);
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('btn-install-pwa');
            if (installBtn) installBtn.classList.remove('hidden-screen');
        });

        async function triggerPwaInstall() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            const installBtn = document.getElementById('btn-install-pwa');
            if (installBtn) installBtn.classList.add('hidden-screen');
        }

        function toggleTheme() {
            const body = document.body;
            const isLight = body.classList.toggle('light-mode');
            localStorage.setItem("MRD_ADMIN_THEME", isLight ? "light" : "dark");
            updateThemeIcon();
            renderContent(currentTab);
        }

        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            if (!icon) return;
            const isLight = document.body.classList.contains('light-mode');
            icon.setAttribute('data-lucide', isLight ? 'moon' : 'sun');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function showScreen(id) {
            ['activation-screen', 'login-screen', 'main-app'].forEach(el => {
                const screen = document.getElementById(el);
                if (screen) screen.classList.add('hidden-screen');
            });
            const target = document.getElementById(id);
            if (target) target.classList.remove('hidden-screen');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function checkAdminState() {
            if (!GAS_URL) {
                showScreen('activation-screen');
            } else {
                try {
                    adminInfo = JSON.parse(localStorage.getItem(STORAGE_ADMIN));
                } catch(e) {
                    localStorage.removeItem(STORAGE_ADMIN);
                }

                if (!adminInfo) {
                    showScreen('login-screen');
                    fetchConfigBg();
                    clearPin();
                } else {
                    showScreen('main-app');
                    document.getElementById('admin-name').innerText = adminInfo.name;
                    document.getElementById('admin-role').innerText = adminInfo.role;
                    
                    enforceSidebarPermissions();
                    
                    // JAMINAN KEAMANAN: Alihkan tab bawaan jika akses ke "Users" dilarang
                    const role = (adminInfo.role || "").toLowerCase().trim();
                    if (role !== "administrator") {
                        const parsed = parseKeterangan(adminInfo.keterangan || "");
                        if (parsed.adminAccess !== "ON") {
                            alert("Akses Ditolak!\n\nAkun Anda telah dinonaktifkan dari akses Backoffice.");
                            logoutAdmin();
                            return;
                        }
                        if (!parsed.allowedTabs.includes("Users") && parsed.allowedTabs.length > 0) {
                            currentTab = parsed.allowedTabs[0]; 
                        }
                    }
                    
                    switchTab(currentTab);
                }
            }
        }

        // PARSER DATA METADATA OTORISASI SAAS ACL
        function parseKeterangan(keteranganStr) {
            let adminAccess = "OFF";
            let allowedTabs = [];
            let cleanKeterangan = keteranganStr || "";

            if (keteranganStr) {
                const accessMatch = keteranganStr.match(/\[ADMIN_ACCESS:(ON|OFF)\]/);
                if (accessMatch) adminAccess = accessMatch[1];

                const tabsMatch = keteranganStr.match(/\[ALLOWED_TABS:([^\]]+)\]/);
                if (tabsMatch) allowedTabs = tabsMatch[1].split(",");
                
                cleanKeterangan = keteranganStr.replace(/\[ADMIN_ACCESS:(ON|OFF)\]/, "").replace(/\[ALLOWED_TABS:([^\]]+)\]/, "").trim();
                if (cleanKeterangan.endsWith("|")) cleanKeterangan = cleanKeterangan.slice(0, -1).trim();
            }
            return { adminAccess, allowedTabs, cleanKeterangan };
        }

        function enforceSidebarPermissions() {
            const role = (adminInfo.role || "").toLowerCase().trim();
            if (role === "administrator") return; // Bypass penuh untuk admin dewa (USR-0000)

            const parsed = parseKeterangan(adminInfo.keterangan || "");
            
            const tabs = ["Users", "Attendance", "Menu", "Promo", "Config"];
            tabs.forEach(tab => {
                const navBtn = document.getElementById(`nav-${tab}`);
                const mobBtn = document.getElementById(`mob-nav-${tab}`);
                const hasAccess = parsed.adminAccess === "ON" && parsed.allowedTabs.includes(tab);

                if (!hasAccess) {
                    if (navBtn) navBtn.classList.add('hidden-screen');
                    if (mobBtn) mobBtn.classList.add('hidden-screen');
                } else {
                    if (navBtn) navBtn.classList.remove('hidden-screen');
                    if (mobBtn) mobBtn.classList.remove('hidden-screen');
                }
            });

            const reportTabs = ["ProdSales", "AuditSales"];
            let hasReportsAccess = false;
            reportTabs.forEach(tab => {
                const navBtn = document.getElementById(`nav-${tab}`);
                const mobBtn = document.getElementById(`mob-nav-${tab}`);
                const hasAccess = parsed.adminAccess === "ON" && parsed.allowedTabs.includes(tab);
                if (hasAccess) hasReportsAccess = true;

                if (!hasAccess) {
                    if (navBtn) navBtn.classList.add('hidden-screen');
                    if (mobBtn) mobBtn.classList.add('hidden-screen');
                } else {
                    if (navBtn) navBtn.classList.remove('hidden-screen');
                    if (mobBtn) mobBtn.classList.remove('hidden-screen');
                }
            });

            const hasHrdAccess = parsed.allowedTabs.includes("Users") || parsed.allowedTabs.includes("Attendance");
            const hrdGroup = document.getElementById('group-hrd');
            if (!hasHrdAccess && hrdGroup) hrdGroup.classList.add('hidden-screen');

            const reportGroup = document.getElementById('group-reports');
            if (!hasReportsAccess && reportGroup) reportGroup.classList.add('hidden-screen');
        }

        async function activateAdminSystem() {
            const input = document.getElementById('api-input').value.trim();
            if(!input) return alert("Masukkan URL API Deploy Anda!");
            const btn = document.getElementById('btn-activate');
            btn.innerHTML = "Memverifikasi...";
            btn.disabled = true;

            try {
                const res = await fetch(input, { method: 'POST', body: JSON.stringify({ action: 'getConfig' }) });
                const json = await res.json();
                if(json.success) {
                    localStorage.setItem(STORAGE_API, input);
                    GAS_URL = input;
                    window.location.reload();
                } else {
                    throw new Error("Gagal");
                }
            } catch (e) {
                alert("Verifikasi Gagal!");
                btn.innerHTML = "Aktifkan Backoffice";
                btn.disabled = false;
            }
        }

        async function fetchConfigBg() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getConfig' }) });
                const json = await res.json();
                if (json.success) {
                    document.getElementById('login-resto-name').innerText = json.data["NAMA_PERUSAHAAN"] || "AMR ADMIN";
                }
            } catch(e) {}
        }

        function pressNum(num) {
            if(loginPinValue.length < 4) {
                loginPinValue += num;
                updateLoginDots();
                if(loginPinValue.length === 4) setTimeout(loginAdmin, 300);
            }
        }

        // SINKRONISASI PENGHAPUS PIN BACKSPACE
        function backspacePin() {
            if(loginPinValue.length > 0) {
                loginPinValue = loginPinValue.slice(0, -1);
                updateLoginDots();
            }
        }

        function clearPin() {
            loginPinValue = "";
            updateLoginDots();
        }

        function updateLoginDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, idx) => {
                if(idx < loginPinValue.length) { 
                    dot.classList.add('bg-amber-500', 'border-amber-500'); 
                    dot.classList.remove('bg-transparent', 'border-slate-600'); 
                } else { 
                    dot.classList.remove('bg-amber-500', 'border-amber-500'); 
                    dot.classList.add('bg-transparent', 'border-slate-600'); 
                }
            });
        }

        async function loginAdmin() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'loginPOS', data: { pin: loginPinValue } }) });
                const json = await res.json();
                if(json.success) {
                    const roleClean = json.role ? json.role.toLowerCase().trim() : "";
                    
                    if (roleClean === "administrator") {
                        localStorage.setItem(STORAGE_ADMIN, JSON.stringify(json));
                        window.location.reload();
                        return;
                    }

                    const parsed = parseKeterangan(json.keterangan || "");
                    if (parsed.adminAccess === "ON") {
                        localStorage.setItem(STORAGE_ADMIN, JSON.stringify(json));
                        window.location.reload();
                    } else {
                        alert("Akses Ditolak!\n\nAkun Anda tidak memiliki izin otorisasi untuk mengakses Backoffice.");
                        clearPin();
                    }
                } else {
                    alert(json.message || "PIN Salah!");
                    clearPin();
                }
            } catch(e) {
                alert("Koneksi gagal.");
                clearPin();
            }
        }

        function logoutAdmin() {
            if (confirm("Keluar dari sesi admin?")) {
                localStorage.removeItem(STORAGE_ADMIN);
                window.location.reload();
            }
        }

        function resetLicense() {
            if(confirm("Hapus lisensi dan reset cache?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        function toggleHrdMenu() {
            const submenu = document.getElementById('hrd-submenu');
            const chevron = document.getElementById('hrd-chevron');
            if (submenu.classList.contains('hidden')) {
                submenu.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                submenu.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        function toggleReportMenu() {
            const submenu = document.getElementById('report-submenu');
            const chevron = document.getElementById('report-chevron');
            if (submenu.classList.contains('hidden')) {
                submenu.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                submenu.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-slate-950', 'bg-slate-800/80');
                btn.classList.add('text-slate-400');
            });

            const activeBtn = document.getElementById(`nav-${tabName}`);
            if (activeBtn) {
                if (tabName === 'Users' || tabName === 'Attendance') {
                    activeBtn.classList.add('bg-slate-800/80', 'text-white');
                    document.getElementById('hrd-submenu').classList.remove('hidden');
                    document.getElementById('hrd-chevron').classList.add('rotate-180');
                } else if (tabName === 'ProdSales' || tabName === 'AuditSales') {
                    activeBtn.classList.add('bg-slate-800/80', 'text-white');
                    document.getElementById('report-submenu').classList.remove('hidden');
                    document.getElementById('report-chevron').classList.add('rotate-180');
                } else {
                    activeBtn.classList.add('bg-amber-500', 'text-slate-950');
                }
            }

            document.querySelectorAll('.mob-nav-btn').forEach(btn => {
                btn.className = "mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-slate-800 text-slate-400";
            });
            const activeMobBtn = document.getElementById(`mob-nav-${tabName}`);
            if (activeMobBtn) activeMobBtn.className = "mob-nav-btn px-4 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap bg-amber-500 text-slate-950";

            renderContent(tabName);
        }

        function renderContent(tab) {
            const area = document.getElementById('content-area');
            if (!area) return;

            const themeParam = document.body.classList.contains('light-mode') ? '?theme=light' : '';

            if (tab === "Users") {
                area.className = "flex-1 h-full overflow-hidden p-0 md:p-4";
                area.innerHTML = `<iframe src="admin-users.html${themeParam}" class="w-full h-full border-0 bg-transparent rounded-2xl"></iframe>`;
            } else if (tab === "Attendance") {
                area.className = "flex-1 h-full overflow-hidden p-0 md:p-4";
                area.innerHTML = `<iframe src="admin-attendance.html${themeParam}" class="w-full h-full border-0 bg-transparent rounded-2xl"></iframe>`;
            } else if (tab === "Menu") {
                area.className = "flex-1 h-full overflow-hidden p-0 md:p-4";
                area.innerHTML = `<iframe src="admin-menu.html${themeParam}" class="w-full h-full border-0 bg-transparent rounded-2xl"></iframe>`;
            } else if (tab === "Promo") {
                area.className = "flex-1 h-full overflow-hidden p-0 md:p-4";
                area.innerHTML = `<iframe src="admin-promo.html${themeParam}" class="w-full h-full border-0 bg-transparent rounded-2xl"></iframe>`;
            } else if (tab === "Config") {
                area.className = "flex-1 h-full overflow-hidden p-0 md:p-4";
                area.innerHTML = `<iframe src="admin-config.html${themeParam}" class="w-full h-full border-0 bg-transparent rounded-2xl"></iframe>`;
            } else if (tab === "ProdSales") {
                area.className = "flex-1 h-full overflow-hidden p-0 md:p-4";
                area.innerHTML = `<iframe src="admin-reports-product.html${themeParam}" class="w-full h-full border-0 bg-transparent rounded-2xl"></iframe>`;
            } else if (tab === "AuditSales") {
                area.className = "flex-1 h-full overflow-hidden p-0 md:p-4";
                area.innerHTML = `<iframe src="admin-reports-audit.html${themeParam}" class="w-full h-full border-0 bg-transparent rounded-2xl"></iframe>`;
            } else {
                area.className = "flex-1 overflow-y-auto p-6 flex flex-col justify-center items-center text-center space-y-4";
                area.innerHTML = `
                    <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-full flex items-center justify-center text-amber-500">
                        <i data-lucide="construction" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-black text-white uppercase tracking-wider">Modul ${tab}</h3>
                        <p class="text-xs text-slate-400 mt-2 max-w-sm leading-relaxed">
                            Pengelolaan data master <strong>${tab}</strong> saat ini masih dijalankan secara aktif melalui layanan Backoffice AppSheet Anda.
                        </p>
                    </div>
                `;
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
    </script>
</body>
</html>
