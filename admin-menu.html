<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management Backoffice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;950&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: transparent; }
        .hidden-screen { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* =========================================================================
         * OVERRIDE TEMA TERANG PREMIUM UNTUK IFRAME ANAK (LIGHT MODE)
         * ========================================================================= */
        body.light-mode {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-mode .text-white {
            color: #0f172a !important;
        }
        body.light-mode .text-slate-300 {
            color: #334155 !important;
        }
        body.light-mode .text-slate-400 {
            color: #475569 !important;
        }
        body.light-mode .text-slate-500 {
            color: #64748b !important;
        }
        body.light-mode .bg-slate-900,
        body.light-mode .bg-slate-900\/40,
        body.light-mode .bg-slate-900\/60 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
        }
        body.light-mode .border-slate-800,
        body.light-mode .border-slate-850 {
            border-color: #cbd5e1 !important;
        }
        body.light-mode table th {
            background-color: #f1f5f9 !important;
            color: #475569 !important;
            border-bottom-color: #cbd5e1 !important;
        }
        body.light-mode table td {
            color: #1e293b !important;
            border-bottom-color: #f1f5f9 !important;
        }
        body.light-mode tr:hover {
            background-color: #f8fafc !important;
        }
        body.light-mode input,
        body.light-mode select,
        body.light-mode textarea {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode input::placeholder {
            color: #94a3b8 !important;
        }
        body.light-mode .bg-slate-950,
        body.light-mode .bg-slate-950\/40 {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
        }
        body.light-mode #modal-form > div,
        body.light-mode #modal-delete-menu > div {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode #form-area-container {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
        }
    </style>
</head>
<body class="text-slate-100 p-2 overflow-y-auto h-full animate-fade-in">

    <!-- DETEKSI WARISAN TEMA INDUK SAAS -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>

    <!-- HEADER -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-4 mb-6">
        <div>
            <h2 class="text-lg font-black text-white uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="utensils" class="text-amber-500"></i> Manajemen Menu Kuliner
            </h2>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">Kelola data menu, harga, rute dapur, dan area cabang</p>
        </div>
        <button onclick="openFormModal()" class="w-full sm:w-auto px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-black rounded-xl shadow-lg flex items-center justify-center gap-1.5 transition">
            <i data-lucide="plus" class="w-4 h-4"></i> TAMBAH MENU BARU
        </button>
    </div>

    <!-- FILTER BAR (KATEGORI MEMBACA SPREADSHEET 100% DINAMIS) -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6">
        <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
            <input type="text" id="search-input" onkeyup="filterMenu()" placeholder="Cari nama hidangan..." class="w-full pl-9 pr-4 py-2.5 bg-slate-900 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-amber-500">
        </div>
        <select id="filter-category" onchange="filterMenu()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-2.5 outline-none text-xs focus:border-amber-500">
            <option value="">Memuat Kategori...</option>
        </select>
        <!-- Dropdown Cabang Dinamis (SaaS) -->
        <select id="filter-area" onchange="filterMenu()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-2.5 outline-none text-xs focus:border-amber-500">
            <option value="">Memuat Cabang...</option>
        </select>
        <select id="filter-status" onchange="filterMenu()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-2.5 outline-none text-xs focus:border-amber-500">
            <option value="">Semua Status</option>
            <option value="Available">Available (Tersedia)</option>
            <option value="Unavailable">Unavailable (Habis)</option>
        </select>
    </div>

    <!-- DATA GRID MENU -->
    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-12">
        <div class="col-span-full py-20 text-center text-slate-500 animate-pulse font-semibold">Mengambil daftar hidangan dari database...</div>
    </div>

    <!-- MODAL FORM TAMBAH / EDIT MENU -->
    <div id="modal-form" class="hidden-screen fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 shrink-0 border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="text-sm font-black text-amber-500 uppercase tracking-wider">Tambah Menu Baru</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-4 pr-1 text-left">
                <input type="hidden" id="form-menu-id">
                
                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nama Menu/Hidangan</label>
                        <input type="text" id="form-name" placeholder="Nama Hidangan" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-amber-500">
                    </div>
                </div>

                <!-- SEKSI HARGA HPP VS HARGA JUAL (MEMPROSES KOLOM COSTPRICE) -->
                <div class="grid grid-cols-2 gap-3 bg-slate-950/40 p-3 border border-slate-850 rounded-2xl">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Harga Pokok (HPP) (Rp)</label>
                        <input type="number" id="form-hpp" placeholder="Murni HPP" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 text-slate-400 rounded-xl outline-none text-xs focus:border-amber-500 font-bold">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Harga Jual (Rp)</label>
                        <input type="number" id="form-price" placeholder="Murni Jual" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-amber-500 font-bold">
                    </div>
                </div>

                <!-- CASCADING DROP-DOWNS DINAMIS (REVISI 2 & 3 - BEBAS TULISAN DROPDOWN MATI) -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Kategori Utama</label>
                        <select id="form-category" onchange="handleCategoryChange()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white focus:border-amber-500">
                            <!-- Diisi 100% dinamis dari database -->
                        </select>
                        <input type="text" id="form-category-new" onkeyup="updateSubCategoryDropdown()" placeholder="Tulis Kategori baru..." class="hidden-screen mt-2 w-full px-3 py-2 bg-slate-950 border-2 border-emerald-500/30 text-white rounded-xl outline-none text-xs focus:border-emerald-500">
                    </div>
                    
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Sub-Kategori</label>
                        <select id="form-subcategory-select" onchange="toggleCustomSubCategoryInput()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white focus:border-amber-500">
                            <!-- Diisi 100% dinamis dari database -->
                        </select>
                        <input type="text" id="form-subcategory-new" placeholder="Tulis Sub-Kategori baru..." class="hidden-screen mt-2 w-full px-3 py-2 bg-slate-950 border-2 border-emerald-500/30 text-white rounded-xl outline-none text-xs focus:border-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Rute Cetak Printer</label>
                        <select id="form-route" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white">
                            <option value="Kitchen">Kitchen (Dapur)</option>
                            <option value="Bar">Bar (Minuman)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Status Menu</label>
                        <select id="form-status" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white">
                            <option value="Available">Available (Tersedia)</option>
                            <option value="Unavailable">Unavailable (Habis)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2.5">Aktif di Cabang (SaaS Area Group)</label>
                    <div id="form-area-container" class="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-slate-950 border border-slate-850 p-3 rounded-2xl">
                        <span class="text-xs text-slate-600 animate-pulse font-semibold col-span-full text-center">Memuat area...</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Foto Hidangan (Unggah ke Drive CDN)</label>
                        <input type="file" id="form-image-file" accept="image/*" onchange="convertImageToBase64()" class="w-full text-[10px] text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[10px] file:font-bold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600 file:cursor-pointer bg-slate-950 border border-slate-800 rounded-xl py-1">
                        <input type="hidden" id="form-image" value="">
                        <input type="hidden" id="form-image-base64" value="">
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Deskripsi / Penjelasan Menu</label>
                    <textarea id="form-description" rows="2" placeholder="Deskripsi lengkap data menu..." class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs"></textarea>
                </div>
            </div>
            
            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-end gap-2 shrink-0">
                <button onclick="closeModal()" class="px-5 py-2 text-xs font-bold text-slate-400 hover:text-white transition">Batal</button>
                <button onclick="submitMenuForm()" id="btn-save" class="px-6 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs rounded-xl shadow-lg transition">SIMPAN MENU</button>
            </div>
        </div>
    </div>

    <!-- MODAL: OTP ATASAN UNTUK HAPUS MENU (SOFT DELETE) -->
    <div id="modal-delete-menu" class="hidden-screen fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl flex flex-col text-center">
            <div class="w-14 h-14 bg-rose-500/10 border border-rose-500/30 rounded-full flex items-center justify-center mx-auto mb-3 text-rose-500">
                <i data-lucide="trash-2" class="w-7 h-7 animate-pulse"></i>
            </div>
            <h3 class="text-sm font-black text-rose-500 uppercase tracking-wider">Otorisasi Hapus Menu</h3>
            <p class="text-xs text-slate-400 mb-4 leading-relaxed">Penghapusan menu kuliner dari daftar aktif memerlukan verifikasi OTP Manager.</p>
            
            <input type="hidden" id="delete-menu-id">
            <input type="password" id="delete-menu-otp" maxlength="4" placeholder="••••" class="w-full px-4 py-3 bg-slate-950 border-2 border-slate-800 text-amber-500 text-center text-2xl tracking-[0.5em] rounded-xl outline-none font-bold mb-4 focus:border-rose-500">
            
            <div class="flex gap-3">
                <button onclick="closeDeleteMenuModal()" class="flex-1 py-2.5 text-slate-400 font-bold text-xs hover:text-white">Batal</button>
                <button onclick="submitDeleteMenuAuth()" id="btn-exec-delete-menu" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-black text-xs rounded-xl shadow-lg">HAPUS MENU</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = localStorage.getItem("MRD_API_URL");
        let allMenus = [];
        let availableAreas = [];

        window.onload = () => {
            if (GAS_URL) {
                fetchAdminMenu();
                loadDynamicAreas();
            }
        };

        // HUBUNGKAN RE-ROUTE ALERT LOKAL KE INDUK UTAMA (REVISI ALLERT SAAS)
        if (window.parent && typeof window.parent.alert === 'function' && window.parent.alert !== window.alert) {
            window.alert = function(msg) {
                window.parent.alert(msg);
            };
        }

        async function fetchAdminMenu() {
            const container = document.getElementById('menu-grid');
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getAdminMenu" })
                });
                const json = await res.json();
                if (json.success) {
                    allMenus = json.data;
                    renderMenuGrid(allMenus);
                    renderDynamicCategoryFilters(); 
                } else {
                    container.innerHTML = `<div class="col-span-full py-8 text-center text-rose-500 font-bold">Gagal: ${json.message}</div>`;
                }
            } catch (e) {
                container.innerHTML = `<div class="col-span-full py-8 text-center text-rose-500 font-bold">Koneksi putus ke database!</div>`;
            }
        }

        function renderMenuGrid(dataList) {
            const container = document.getElementById('menu-grid');
            if (dataList.length === 0) {
                container.innerHTML = `<div class="col-span-full py-20 text-center text-slate-600 font-semibold flex flex-col items-center justify-center gap-2"><i data-lucide="search-x" class="w-12 h-12 opacity-30"></i><span>Hidangan tidak ditemukan</span></div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = dataList.map(item => {
                const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=1e293b&color=f59e0b&size=200&font-size=0.33`;
                
                const statusBadge = item.status === "Available"
                    ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[9px] px-2 py-0.5 rounded-full font-bold">Available</span>`
                    : `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[9px] px-2 py-0.5 rounded-full font-bold">Unavailable (Habis)</span>`;

                const routeBadge = item.route === "Kitchen"
                    ? `<span class="text-amber-500 flex items-center gap-1 text-[10px] font-semibold"><i data-lucide="chef-hat" class="w-3.5 h-3.5"></i> Kitchen</span>`
                    : `<span class="text-indigo-400 flex items-center gap-1 text-[10px] font-semibold"><i data-lucide="glass-water" class="w-3.5 h-3.5"></i> Bar (Drinks)</span>`;

                const areaBadges = item.area 
                    ? item.area.split(',').map(a => `<span class="bg-slate-900 border border-slate-800 text-slate-400 text-[9px] px-1.5 py-0.5 rounded font-bold">${a.trim()}</span>`).join(' ')
                    : `<span class="text-slate-600 text-[9px] font-bold">Semua Cabang</span>`;

                const cleanSubCategory = item.subCategory ? `<span class="text-slate-500 font-bold text-[10px] block mt-1">Sub: ${item.subCategory}</span>` : '';

                return `
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden flex flex-col hover:border-amber-500/50 transition duration-300">
                        <div class="h-28 w-full relative bg-slate-950 overflow-hidden shrink-0">
                            <img src="${item.image || fallbackImg}" onerror="this.onerror=null; this.src='${fallbackImg}';" class="w-full h-full object-cover">
                            <div class="absolute top-2 left-2">${statusBadge}</div>
                            <div class="absolute top-2 right-2 bg-slate-900/80 backdrop-blur-md border border-slate-700 text-slate-300 text-[9px] font-bold px-2 py-0.5 rounded">${item.category}</div>
                        </div>

                        <div class="p-3 flex-1 flex flex-col justify-between text-left">
                            <div>
                                <h3 class="font-bold text-white text-sm truncate uppercase tracking-tight" title="${item.name}">${item.name}</h3>
                                ${cleanSubCategory}
                                <p class="text-[10px] text-slate-500 mt-1 line-clamp-2 h-7 leading-relaxed">${item.description || "Tidak ada deskripsi hidangan."}</p>
                                <div class="flex items-center justify-between border-t border-slate-800/80 mt-3 pt-2">
                                    ${routeBadge}
                                    <span class="text-amber-500 font-black text-xs">Rp ${item.price.toLocaleString('id-ID')}</span>
                                </div>
                            </div>
                            
                            <div class="border-t border-slate-800/80 mt-3 pt-2.5 flex items-center justify-between">
                                <div class="flex flex-wrap gap-1 max-w-[70%]">
                                    ${areaBadges}
                                </div>
                                <div class="flex gap-1.5">
                                    <button onclick="editMenu('${item.menuId}')" class="p-1.5 bg-amber-500/10 text-amber-500 border border-amber-500/20 rounded-lg hover:bg-amber-500 hover:text-slate-950 transition"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                    <button onclick="requestDeleteMenu('${item.menuId}')" class="p-1.5 bg-rose-500/10 text-rose-500 border border-rose-500/20 rounded-lg hover:bg-rose-500 hover:text-white transition" title="Hapus Menu"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function filterMenu() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('filter-category').value;
            const area = document.getElementById('filter-area').value;
            const status = document.getElementById('filter-status').value;

            let filtered = allMenus.filter(item => {
                const matchQuery = item.name.toLowerCase().includes(query) || (item.description && item.description.toLowerCase().includes(query));
                const matchCategory = category === "" || item.category === category;
                const matchArea = area === "" || (item.area && item.area.toLowerCase().includes(area.toLowerCase()));
                const matchStatus = status === "" || item.status === status;
                return matchQuery && matchCategory && matchArea && matchStatus;
            });
            renderMenuGrid(filtered);
        }

        async function loadDynamicAreas() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "getAvailableAreas" }) });
                const json = await res.json();
                if (json.success) {
                    availableAreas = json.data;
                    
                    const filterSelect = document.getElementById('filter-area');
                    let filterOptions = `<option value="">Semua Cabang (Area)</option>`;
                    availableAreas.forEach(area => { filterOptions += `<option value="${area}">${area}</option>`; });
                    filterSelect.innerHTML = filterOptions;

                    const formContainer = document.getElementById('form-area-container');
                    formContainer.innerHTML = availableAreas.map(area => `
                        <label class="flex items-center gap-1.5 text-xs text-slate-300 font-bold cursor-pointer hover:text-white">
                            <input type="checkbox" name="form-menu-area" value="${area}" class="rounded accent-amber-500 w-3.5 h-3.5"> ${area}
                        </label>
                    `).join('');
                }
            } catch (e) {
                console.error("Gagal menyinkronkan data area");
            }
        }

        // =========================================================================
        // REVISI 2: GENERATOR FILTER KATEGORI UTAMA DINAMIS (SAAS STANDARD)
        // =========================================================================
        function renderDynamicCategoryFilters() {
            let uniqueCats = new Set(); 
            allMenus.forEach(item => {
                if (item.category && item.category.trim() !== "") {
                    uniqueCats.add(item.category.trim());
                }
            });

            let optionsHtml = `<option value="">Semua Kategori</option>`;
            Array.from(uniqueCats).sort().forEach(cat => {
                optionsHtml += `<option value="${cat}">${cat}</option>`;
            });
            document.getElementById('filter-category').innerHTML = optionsHtml;
        }

        // =========================================================================
        // REVISI 2 & 3: GENERATOR KATEGORI & SUB-KATEGORI 100% DINAMIS (FORM MODAL)
        // =========================================================================
        function initCategoryAndSubCategoryDropdowns(selectedCat = "", selectedSub = "") {
            const catSelect = document.getElementById('form-category');
            const newCatInput = document.getElementById('form-category-new');
            
            newCatInput.classList.add('hidden-screen');
            newCatInput.value = "";

            // Menyisir seluruh kategori unik di database Menu klien (Zero Hardcoded)
            let uniqueCats = new Set();
            allMenus.forEach(item => {
                if (item.category && item.category.trim() !== "") {
                    uniqueCats.add(item.category.trim());
                }
            });

            // Fallback bawaan jika database klien masih kosong baru
            if (uniqueCats.size === 0) {
                uniqueCats.add("Makanan");
                uniqueCats.add("Minuman");
                uniqueCats.add("Snack");
            }

            let optionsHtml = ``;
            Array.from(uniqueCats).sort().forEach(cat => {
                optionsHtml += `<option value="${cat}">${cat}</option>`;
            });
            optionsHtml += `<option value="ADD_NEW_CAT" class="text-emerald-400 font-bold">+ Tambah Kategori Baru</option>`;
            catSelect.innerHTML = optionsHtml;

            if (selectedCat !== "") {
                if (uniqueCats.has(selectedCat)) {
                    catSelect.value = selectedCat;
                } else {
                    catSelect.value = "ADD_NEW_CAT";
                    newCatInput.classList.remove('hidden-screen');
                    newCatInput.value = selectedCat;
                }
            }
            
            updateSubCategoryDropdown(selectedSub);
        }

        function handleCategoryChange() {
            const selectVal = document.getElementById('form-category').value;
            const newCatInput = document.getElementById('form-category-new');
            
            if (selectVal === "ADD_NEW_CAT") {
                newCatInput.classList.remove('hidden-screen');
                newCatInput.focus();
            } else {
                newCatInput.classList.add('hidden-screen');
                newCatInput.value = "";
            }
            updateSubCategoryDropdown();
        }

        function updateSubCategoryDropdown(selectedSubValue = "") {
            const catSelectValue = document.getElementById('form-category').value;
            const newCatValue = document.getElementById('form-category-new').value.trim();
            const activeCategory = catSelectValue === "ADD_NEW_CAT" ? newCatValue : catSelectValue;

            const subSelect = document.getElementById('form-subcategory-select');
            
            // Menyisir seluruh sub-kategori unik yang di bawah kategori utama terpilih
            let uniqueSubs = new Set();
            allMenus.forEach(item => {
                if (item.category === activeCategory && item.subCategory && item.subCategory.trim() !== "") {
                    uniqueSubs.add(item.subCategory.trim());
                }
            });

            let optionsHtml = `<option value="">- Tanpa Sub-Kategori -</option>`;
            Array.from(uniqueSubs).sort().forEach(sub => {
                optionsHtml += `<option value="${sub}">${sub}</option>`;
            });
            optionsHtml += `<option value="ADD_NEW" class="text-emerald-400 font-bold">+ Tambah Sub-Kategori Baru</option>`;
            
            subSelect.innerHTML = optionsHtml;

            if (selectedSubValue !== "") {
                if (uniqueSubs.has(selectedSubValue)) {
                    subSelect.value = selectedSubValue;
                } else if (selectedSubValue.trim() !== "") {
                    subSelect.value = "ADD_NEW";
                    const newTxtInput = document.getElementById('form-subcategory-new');
                    newTxtInput.classList.remove('hidden-screen');
                    newTxtInput.value = selectedSubValue;
                }
            } else {
                document.getElementById('form-subcategory-new').classList.add('hidden-screen');
                document.getElementById('form-subcategory-new').value = "";
            }
        }

        function toggleCustomSubCategoryInput() {
            const selectVal = document.getElementById('form-subcategory-select').value;
            const newTxtInput = document.getElementById('form-subcategory-new');
            
            if (selectVal === "ADD_NEW") {
                newTxtInput.classList.remove('hidden-screen');
                newTxtInput.focus();
            } else {
                newTxtInput.classList.add('hidden-screen');
                newTxtInput.value = "";
            }
        }

        function convertImageToBase64() {
            const file = document.getElementById('form-image-file').files[0];
            const base64Input = document.getElementById('form-image-base64');
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert("Ukuran berkas gambar tidak boleh melebihi 2MB!");
                    document.getElementById('form-image-file').value = "";
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = function() {
                    base64Input.value = reader.result;
                };
                reader.readAsDataURL(file);
            } else {
                base64Input.value = "";
            }
        }

        function openFormModal(menuId = null) {
            const modal = document.getElementById('modal-form');
            modal.classList.remove('hidden-screen');

            document.getElementById('form-menu-id').value = "";
            document.getElementById('form-name').value = "";
            document.getElementById('form-price').value = "";
            // REVISI 1: Reset input HPP form modal
            document.getElementById('form-hpp').value = "";
            document.getElementById('form-category').value = "";
            document.getElementById('form-route').value = "Kitchen";
            document.getElementById('form-status').value = "Available";
            document.getElementById('form-image').value = "";
            document.getElementById('form-image-file').value = "";
            document.getElementById('form-image-base64').value = "";
            document.getElementById('form-description').value = "";
            document.getElementById('form-category-new').classList.add('hidden-screen');
            document.getElementById('form-category-new').value = "";
            document.getElementById('form-subcategory-new').classList.add('hidden-screen');
            document.getElementById('form-subcategory-new').value = "";

            document.querySelectorAll('input[name="form-menu-area"]').forEach(cb => cb.checked = false);

            if (menuId) {
                document.getElementById('modal-title').innerText = "Edit Data Hidangan";
                const item = allMenus.find(x => x.menuId === menuId);
                if (item) {
                    document.getElementById('form-menu-id').value = item.menuId;
                    document.getElementById('form-name').value = item.name;
                    document.getElementById('form-price').value = item.price;
                    // REVISI 1: Pemuatan nilai HPP lama ke form edit
                    document.getElementById('form-hpp').value = item.hpp || "";
                    document.getElementById('form-route').value = item.route;
                    document.getElementById('form-status').value = item.status;
                    document.getElementById('form-image').value = item.image;
                    document.getElementById('form-description').value = item.description;

                    initCategoryAndSubCategoryDropdowns(item.category, item.subCategory);

                    if (item.area) {
                        const activeAreas = item.area.split(',').map(a => a.trim());
                        activeAreas.forEach(a => {
                            const cb = document.querySelector(`input[name="form-menu-area"][value="${a}"]`);
                            if (cb) cb.checked = true;
                        });
                    }
                }
            } else {
                document.getElementById('modal-title').innerText = "Tambah Menu Hidangan Baru";
                initCategoryAndSubCategoryDropdowns(); 
            }
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal-form').classList.add('hidden-screen');
        }

        async function submitMenuForm() {
            const name = document.getElementById('form-name').value.trim();
            const price = parseFloat(document.getElementById('form-price').value) || 0;
            // REVISI 1: Pembacaan isian HPP dari modal form
            const hpp = parseFloat(document.getElementById('form-hpp').value) || 0;
            const route = document.getElementById('form-route').value;
            const status = document.getElementById('form-status').value;

            const catSelect = document.getElementById('form-category').value;
            const catNew = document.getElementById('form-category-new').value.trim();
            const finalCategoryValue = catSelect === "ADD_NEW_CAT" ? catNew : catSelect;

            const subSelect = document.getElementById('form-subcategory-select').value;
            const subNew = document.getElementById('form-subcategory-new').value.trim();
            const finalSubCategoryValue = subSelect === "ADD_NEW" ? subNew : subSelect;

            let selectedAreas = [];
            document.querySelectorAll('input[name="form-menu-area"]:checked').forEach(cb => {
                selectedAreas.push(cb.value);
            });
            const areaValue = selectedAreas.join(", ");

            if (!name || price <= 0 || !finalCategoryValue || selectedAreas.length === 0) {
                alert("Mohon lengkapi Nama Menu, Harga Jual, Kategori, dan pilih minimal 1 Area Cabang aktif!");
                return;
            }

            const saveBtn = document.getElementById('btn-save');
            saveBtn.innerText = "Mendaftarkan...";
            saveBtn.disabled = true;

            const menuData = {
                menuId: document.getElementById('form-menu-id').value,
                name: name,
                price: price,
                // REVISI 1: Pengiriman data HPP ke payload menuData
                hpp: hpp,
                category: finalCategoryValue, 
                subCategory: finalSubCategoryValue, 
                route: route,
                status: status,
                area: areaValue, 
                image: document.getElementById('form-image').value,
                imageBase64: document.getElementById('form-image-base64').value,
                description: document.getElementById('form-description').value.trim()
            };

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "saveMenu", data: { menuData: menuData } })
                });
                const json = await res.json();
                if (json.success) {
                    alert(json.message);
                    closeModal();
                    fetchAdminMenu();
                } else {
                    alert("Gagal: " + json.message);
                }
            } catch (e) {
                alert("Gagal melakukan sinkronisasi menu ke server GAS.");
            } finally {
                saveBtn.innerText = "SIMPAN MENU";
                saveBtn.disabled = false;
            }
        }

        function editMenu(menuId) {
            openFormModal(menuId);
        }

        function requestDeleteMenu(menuId) {
            const modal = document.getElementById('modal-delete-menu');
            if (modal) {
                document.getElementById('delete-menu-id').value = menuId;
                document.getElementById('delete-menu-otp').value = "";
                modal.classList.remove('hidden-screen');
                lucide.createIcons();
            }
        }

        function closeDeleteMenuModal() {
            document.getElementById('modal-delete-menu').classList.add('hidden-screen');
        }

        async function submitDeleteMenuAuth() {
            const menuId = document.getElementById('delete-menu-id').value;
            const otp = document.getElementById('delete-menu-otp').value;
            
            if (!otp || otp.length < 4) {
                alert("Masukkan 4-Digit OTP Manager!");
                return;
            }

            const btn = document.getElementById('btn-exec-delete-menu');
            btn.innerText = "Memverifikasi...";
            btn.disabled = true;

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "verifyVoidManager", data: { managerPin: otp } })
                });
                const json = await res.json();

                if (json.success) {
                    const allowedCompRoles = ["admin", "hrd", "manager", "owner"];
                    const managerRole = json.role ? json.role.toLowerCase().trim() : "";
                    const managerType = json.type ? json.type.toLowerCase().trim() : "";

                    if (!allowedCompRoles.includes(managerRole) && managerType !== "vip" && managerType !== "manager") {
                        alert("Otorisasi Ditolak! Penghapusan menu wajib disetujui oleh OTP tingkat Manager.");
                        btn.innerText = "HAPUS MENU";
                        btn.disabled = false;
                        return;
                    }

                    const deleteRes = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({ 
                            action: "archiveMenu", 
                            data: { menuId: menuId, managerName: json.managerName } 
                        })
                    });
                    const deleteJson = await deleteRes.json();

                    if (deleteJson.success) {
                        alert(deleteJson.message);
                        closeDeleteMenuModal();
                        fetchAdminMenu(); 
                    } else {
                        alert("Gagal: " + deleteJson.message);
                    }
                } else {
                    alert(json.message || "OTP Manager Salah atau Kedaluwarsa!");
                }
            } catch(e) {
                alert("Koneksi gagal menghubungi server.");
            } finally {
                btn.innerText = "HAPUS MENU";
                btn.disabled = false;
            }
        }
    </script>
</body>
