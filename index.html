<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Kasir</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/JW1FFbCz/1780229137561.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Menggunakan 100dvh agar tidak tertutup address bar browser */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; overflow: hidden; }
        .hidden-screen { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fade-out { animation: fadeOut 0.5s forwards; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col select-none">

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 bg-[#111827] z-[100] flex flex-col items-center justify-center transition-all">
        <img src="https://i.ibb.co.com/R4ZYj74K/1780229303550.png" alt="Loading" class="w-48 animate-pulse mb-4">
        <p class="text-white text-sm font-semibold tracking-widest animate-bounce">MEMUAT SISTEM...</p>
    </div>

    <!-- 2. SCREEN AKTIVASI -->
    <div id="activation-screen" class="hidden-screen fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 text-center">
            <img src="https://i.ibb.co.com/JW1FFbCz/1780229137561.png" class="w-16 h-16 mx-auto mb-4">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Aktivasi POS</h2>
            <input type="url" id="api-input" placeholder="Masukkan URL API..." class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-indigo-600 outline-none mb-4 text-sm text-center">
            <button onclick="activateSystem()" id="btn-activate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl">Aktifkan Perangkat</button>
        </div>
    </div>

    <!-- 3. SCREEN LOGIN -->
    <div id="login-screen" class="hidden-screen fixed inset-0 bg-slate-900 z-40 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 text-center">
            <h2 id="login-resto-name" class="text-xl font-bold text-indigo-600 mb-6 uppercase">RESTO</h2>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">Login Shift</h3>
            <p class="text-sm text-gray-500 mb-6">Masukkan PIN Kasir</p>
            <input type="password" id="login-pin" maxlength="6" pattern="[0-9]*" class="w-full text-center text-4xl tracking-[0.5em] py-4 border-b-2 border-gray-300 focus:border-indigo-600 outline-none mb-8">
            <button onclick="loginKasir()" id="btn-login" class="w-full bg-slate-800 text-white font-bold py-4 rounded-xl text-lg">Buka Mesin POS</button>
        </div>
    </div>

    <!-- 4. MAIN POS APPLICATION -->
    <div id="main-app" class="hidden-screen h-full w-full flex flex-col md:flex-row">
        
        <!-- LEFT: KATEGORI & MENU GRID (60%) -->
        <div class="flex-1 flex flex-col h-full bg-gray-50">
            <header class="bg-white px-4 py-3 flex justify-between items-center shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <img src="https://i.ibb.co.com/JW1FFbCz/1780229137561.png" class="w-8 h-8 rounded-lg">
                    <h1 id="pos-title" class="text-lg font-bold text-gray-800">POS System</h1>
                </div>
                <div class="flex items-center gap-2">
                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> <span id="kasir-name">Kasir</span></span>
                    <button onclick="logoutKasir()" class="p-2 bg-red-50 text-red-600 rounded-lg"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                </div>
            </header>

            <div class="flex gap-2 overflow-x-auto p-4 no-scrollbar bg-white border-b border-gray-200">
                <button onclick="filterMenu('Semua')" class="cat-btn px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold whitespace-nowrap shadow-md">Semua</button>
                <button onclick="filterMenu('Makanan')" class="cat-btn px-4 py-2 rounded-lg bg-gray-100 text-gray-600 text-sm font-semibold whitespace-nowrap">Makanan</button>
                <button onclick="filterMenu('Minuman')" class="cat-btn px-4 py-2 rounded-lg bg-gray-100 text-gray-600 text-sm font-semibold whitespace-nowrap">Minuman</button>
            </div>

            <div id="menu-container" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 xl:grid-cols-3 gap-4 content-start">
                <!-- Data Menu masuk sini -->
            </div>
        </div>

        <!-- RIGHT: CART & CHECKOUT (40%) -->
        <div class="w-full md:w-[400px] bg-white border-l border-gray-200 flex flex-col h-full z-20">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-indigo-50 shrink-0">
                <h2 class="font-bold text-indigo-900 flex items-center gap-2"><i data-lucide="shopping-cart" class="w-5 h-5"></i> Keranjang (<span id="cart-count">0</span>)</h2>
                <button onclick="clearCart()" class="text-xs text-red-500 font-semibold hover:underline">Kosongkan</button>
            </div>

            <div class="p-4 border-b border-gray-100 flex gap-2 shrink-0">
                <div class="flex-1">
                    <label class="text-xs text-gray-500 font-semibold">Nomor Meja/Nama</label>
                    <input type="text" id="order-table" placeholder="M-01 / Takeaway" class="w-full mt-1 px-3 py-2 bg-gray-100 border-none rounded-lg outline-none font-bold text-gray-800">
                </div>
            </div>

            <div id="cart-container" class="flex-1 overflow-y-auto p-2">
                <div class="flex flex-col items-center justify-center h-full text-gray-400">
                    <i data-lucide="shopping-bag" class="w-12 h-12 mb-2 opacity-50"></i>
                    <p class="text-sm">Belum ada pesanan</p>
                </div>
            </div>

            <!-- Kalkulasi (shrink-0 agar tidak tertimpa scroll) -->
            <div class="p-4 border-t border-gray-200 bg-gray-50 shrink-0">
                <div class="flex justify-between text-sm mb-1 text-gray-500"><p>Subtotal</p><p id="cart-subtotal">Rp 0</p></div>
                <div class="flex justify-between text-sm mb-3 text-gray-500"><p>Tax / Pb1</p><p id="cart-tax">Rp 0</p></div>
                <div class="flex justify-between items-end mb-4">
                    <p class="text-sm font-bold text-gray-800">TOTAL</p>
                    <p id="cart-grandtotal" class="text-2xl font-bold text-indigo-600">Rp 0</p>
                </div>
                
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button onclick="processOrder('Cash')" class="py-3 bg-green-500 text-white rounded-xl font-bold shadow-md hover:bg-green-600 transition">CASH</button>
                    <button onclick="processOrder('QRIS')" class="py-3 bg-blue-500 text-white rounded-xl font-bold shadow-md hover:bg-blue-600 transition">QRIS</button>
                </div>
                <button onclick="processOrder('Open')" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold shadow-md hover:bg-slate-900 transition flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Simpan Bill (Open)
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); }); }
        lucide.createIcons();

        const STORAGE_API = "MRD_API_URL";
        const STORAGE_USER = "MRD_CASHIER";
        let GAS_URL = localStorage.getItem(STORAGE_API);
        let cashierInfo = JSON.parse(localStorage.getItem(STORAGE_USER));
        
        let configData = {};
        let menuData = [];
        let cart = [];

        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
                setTimeout(() => {
                    splash.classList.add('hidden-screen');
                    checkState();
                }, 500);
            }, 1500);
        };

        function checkState() {
            if (!GAS_URL) {
                showScreen('activation-screen');
            } else if (!cashierInfo) {
                showScreen('login-screen');
                fetchConfigBg();
            } else {
                showScreen('main-app');
                document.getElementById('kasir-name').innerText = cashierInfo.name;
                initApp();
            }
        }

        function showScreen(id) {
            ['activation-screen', 'login-screen', 'main-app'].forEach(el => document.getElementById(el).classList.add('hidden-screen'));
            document.getElementById(id).classList.remove('hidden-screen');
        }

        async function activateSystem() {
            const input = document.getElementById('api-input').value;
            if(!input) return alert("Masukkan URL!");
            document.getElementById('btn-activate').innerText = "Memeriksa...";
            try {
                const res = await fetch(input, { method: 'POST', body: JSON.stringify({ action: 'getConfig' }) });
                const json = await res.json();
                if(json.success) {
                    localStorage.setItem(STORAGE_API, input);
                    GAS_URL = input;
                    alert("Aktivasi Sukses!");
                    window.location.reload();
                } else throw new Error("Gagal");
            } catch (e) {
                alert("URL API tidak valid atau offline!");
                document.getElementById('btn-activate').innerText = "Aktifkan Perangkat";
            }
        }

        async function fetchConfigBg() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getConfig' }) });
                const json = await res.json();
                if(json.success) document.getElementById('login-resto-name').innerText = json.data["NAMA_PERUSAAN"] || "RESTO";
            } catch(e) {}
        }

        async function loginKasir() {
            const pin = document.getElementById('login-pin').value;
            if(!pin) return;
            document.getElementById('btn-login').innerText = "Memeriksa...";
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'loginPOS', data: { pin: pin } }) });
                const json = await res.json();
                if(json.success) {
                    localStorage.setItem(STORAGE_USER, JSON.stringify(json));
                    window.location.reload();
                } else {
                    alert(json.message);
                    document.getElementById('btn-login').innerText = "Buka Mesin POS";
                }
            } catch (e) {
                alert("Koneksi gagal!");
                document.getElementById('btn-login').innerText = "Buka Mesin POS";
            }
        }

        function logoutKasir() {
            if(confirm("Yakin ingin keluar shift?")) {
                localStorage.removeItem(STORAGE_USER);
                window.location.reload();
            }
        }

        async function initApp() {
            const localMenu = localStorage.getItem('localMenu');
            const localConfig = localStorage.getItem('localConfig');
            if(localConfig) { configData = JSON.parse(localConfig); applyConfig(); }
            if(localMenu) { menuData = JSON.parse(localMenu); renderMenu(menuData); }

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getMenu' }) });
                const json = await res.json();
                if(json.success) {
                    menuData = json.data;
                    localStorage.setItem('localMenu', JSON.stringify(menuData));
                    renderMenu(menuData);
                }
                
                const resConf = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getConfig' }) });
                const jsonConf = await resConf.json();
                if(jsonConf.success) {
                    configData = jsonConf.data;
                    localStorage.setItem('localConfig', JSON.stringify(configData));
                    applyConfig();
                }
            } catch (e) { console.log("Mode Offline"); }
        }

        function applyConfig() {
            if(configData["NAMA_PERUSAAN"]) document.getElementById('pos-title').innerText = configData["NAMA_PERUSAAN"];
        }

        function renderMenu(items) {
            const container = document.getElementById('menu-container');
            container.innerHTML = items.map(item => `
                <div onclick="addToCart('${item.id}', '${item.name}', ${item.price})" class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col overflow-hidden cursor-pointer active:scale-95 transition">
                    <div class="h-28 bg-gray-200 relative shrink-0">
                        ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-gray-400"><i data-lucide="image" class="w-8 h-8"></i></div>`}
                        <div class="absolute top-2 right-2 bg-black/60 text-white text-[10px] px-2 py-1 rounded-md">${item.category}</div>
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <div>
                            <h3 class="text-sm font-bold text-gray-800 line-clamp-2 leading-tight">${item.name}</h3>
                            <p class="text-[10px] text-gray-400 mt-1 line-clamp-2">${item.description || 'Tidak ada deskripsi'}</p>
                        </div>
                        <p class="text-sm font-bold text-indigo-600 mt-2">Rp ${item.price.toLocaleString()}</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function filterMenu(cat) {
            if(cat === 'Semua') renderMenu(menuData);
            else renderMenu(menuData.filter(m => m.category === cat));
        }

        function addToCart(id, name, price) {
            const exist = cart.find(i => i.menuId === id);
            if(exist) { exist.qty++; exist.subtotal = exist.qty * price; }
            else { cart.push({ menuId: id, name: name, price: price, qty: 1, subtotal: price, notes: '' }); }
            renderCart();
        }

        function updateQty(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty <= 0) cart.splice(index, 1);
            else cart[index].subtotal = cart[index].qty * cart[index].price;
            renderCart();
        }

        function addNote(index) {
            const note = prompt("Tambahkan catatan (misal: Pedas):", cart[index].notes);
            if(note !== null) { cart[index].notes = note; renderCart(); }
        }

        function clearCart() {
            if(confirm("Kosongkan pesanan ini?")) { cart = []; document.getElementById('order-table').value = ""; renderCart(); }
        }

        function renderCart() {
            const container = document.getElementById('cart-container');
            const subtotal = cart.reduce((sum, item) => sum + item.subtotal, 0);
            const taxPerc = parseFloat(configData["PAJAK_PB1"] || 0); 
            const tax = (subtotal * taxPerc) / 100;
            const grandTotal = subtotal + tax;

            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-subtotal').innerText = "Rp " + subtotal.toLocaleString();
            document.getElementById('cart-tax').innerText = "Rp " + tax.toLocaleString();
            document.getElementById('cart-grandtotal').innerText = "Rp " + grandTotal.toLocaleString();

            if(cart.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-gray-400"><i data-lucide="shopping-bag" class="w-12 h-12 mb-2 opacity-50"></i><p class="text-sm">Belum ada pesanan</p></div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = cart.map((item, idx) => `
                <div class="bg-white p-3 rounded-xl border border-gray-100 mb-2 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h4 class="text-sm font-bold text-gray-800 leading-tight">${item.name}</h4>
                            <p class="text-xs text-indigo-600 font-semibold mt-1">Rp ${item.subtotal.toLocaleString()}</p>
                        </div>
                        <div class="flex items-center bg-gray-100 rounded-lg">
                            <button onclick="updateQty(${idx}, -1)" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-red-500 font-bold">-</button>
                            <span class="w-6 text-center text-sm font-bold">${item.qty}</span>
                            <button onclick="updateQty(${idx}, 1)" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-green-500 font-bold">+</button>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="addNote(${idx})" class="text-[10px] bg-amber-50 text-amber-600 px-2 py-1 rounded-md flex items-center gap-1 border border-amber-200"><i data-lucide="pen-line" class="w-3 h-3"></i> ${item.notes ? item.notes : "Tambah Catatan"}</button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function processOrder(payMethod) {
            if(cart.length === 0) return alert("Keranjang kosong!");
            const tableNo = document.getElementById('order-table').value.trim();
            if(!tableNo) return alert("Mohon isi Nomor Meja / Nama Pemesan!");

            if(!navigator.onLine) return alert("Koneksi Offline. Gagal mengirim ke server.");

            const subtotal = cart.reduce((sum, item) => sum + item.subtotal, 0);
            const tax = (subtotal * parseFloat(configData["PAJAK_PB1"] || 0)) / 100;
            const grandTotal = subtotal + tax;
            const orderStatus = payMethod === 'Open' ? 'Open' : 'Paid';

            const payload = {
                action: "placeOrder",
                data: {
                    tableNo: tableNo,
                    kasirId: cashierInfo.userId,
                    tax: tax,
                    totalAmount: grandTotal,
                    paymentMethod: payMethod === 'Open' ? '-' : payMethod,
                    orderStatus: orderStatus,
                    items: cart
                }
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const json = await res.json();
                if(json.success) {
                    printRawBT(json.orderId, tableNo, payMethod, subtotal, tax, grandTotal);
                    alert(`Transaksi Sukses! (${payMethod})`);
                    cart = [];
                    document.getElementById('order-table').value = "";
                    renderCart();
                } else {
                    alert("Error dari Server: " + json.message);
                }
            } catch (e) {
                alert("Gagal mengirim pesanan. Server tidak merespon.");
            }
        }

        function printRawBT(orderId, table, payMethod, subtotal, tax, grandTotal) {
            const namaResto = configData["NAMA_PERUSAAN"] || "RESTO";
            const alamat = configData["ALAMAT"] || "Jl. Contoh No.1";
            
            let receipt = `[C]<b>${namaResto}</b>\n[C]${alamat}\n[C]--------------------------------\n[L]ID  : ${orderId}\n[L]Meja: ${table}\n[L]Kasir: ${cashierInfo.name}\n[C]--------------------------------\n`;
            cart.forEach(item => { receipt += `[L]${item.name}\n`; if(item.notes) receipt += `[L]  *${item.notes}\n`; receipt += `[L]${item.qty}x ${item.price} [R]${item.subtotal}\n`; });
            receipt += `[C]--------------------------------\n[L]Subtotal [R]${subtotal}\n`;
            if(tax > 0) receipt += `[L]Pajak/Tax [R]${tax}\n`;
            receipt += `[L]<b>TOTAL</b> [R]<b>${grandTotal}</b>\n[C]--------------------------------\n`;
            receipt += `[C]Status : ${payMethod === 'Open' ? 'BELUM LUNAS (OPEN BILL)' : 'LUNAS (' + payMethod + ')'}\n[C]Terima Kasih Atas Kunjungannya!\n\n\n`;

            const base64Data = btoa(unescape(encodeURIComponent(receipt)));
            const intentUrl = `intent:base64,${base64Data}#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;`;
            window.location.href = intentUrl;
        }
    </script>
</body>
</html>
