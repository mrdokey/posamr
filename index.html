<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Kasir</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/JW1FFbCz/1780229137561.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; overflow: hidden; }
        .hidden-screen { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .smooth-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-card { transition: all 0.2s ease-in-out; }
        .menu-card:active { transform: scale(0.95); opacity: 0.8; }
        .fade-out { animation: fadeOut 0.5s forwards; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        #menu-container { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col select-none">

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 bg-[#111827] z-[100] flex flex-col items-center justify-center smooth-transition">
        <img src="https://i.ibb.co.com/R4ZYj74K/1780229303550.png" alt="Loading" class="w-48 animate-pulse mb-4">
        <p class="text-white text-sm font-semibold tracking-widest animate-bounce">MEMUAT SISTEM...</p>
    </div>

    <!-- 2. SCREEN AKTIVASI -->
    <div id="activation-screen" class="hidden-screen fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4 smooth-transition">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 text-center">
            <img src="https://i.ibb.co.com/JW1FFbCz/1780229137561.png" class="w-16 h-16 mx-auto mb-4">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Aktivasi POS</h2>
            <input type="url" id="api-input" placeholder="Masukkan URL API..." class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-indigo-600 outline-none mb-4 text-sm text-center smooth-transition">
            <button onclick="activateSystem()" id="btn-activate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl smooth-transition shadow-lg">Aktifkan Perangkat</button>
        </div>
    </div>

    <!-- 3. SCREEN LOGIN -->
    <div id="login-screen" class="hidden-screen fixed inset-0 bg-slate-900 z-40 flex items-center justify-center p-4 smooth-transition">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8 text-center">
            <h2 id="login-resto-name" class="text-xl font-bold text-indigo-600 mb-6 uppercase tracking-widest">RESTO</h2>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">Login Shift</h3>
            <p class="text-sm text-gray-500 mb-6">Masukkan PIN Kasir</p>
            <input type="password" id="login-pin" maxlength="6" pattern="[0-9]*" class="w-full text-center text-4xl tracking-[0.5em] py-4 border-b-2 border-gray-300 focus:border-indigo-600 outline-none mb-8 smooth-transition bg-transparent">
            <button onclick="loginKasir()" id="btn-login" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl text-lg smooth-transition shadow-xl">Buka Mesin POS</button>
        </div>
    </div>

    <!-- 4. MAIN POS APPLICATION -->
    <div id="main-app" class="hidden-screen h-full w-full flex flex-col md:flex-row bg-gray-50 smooth-transition">
        
        <!-- LEFT: KATEGORI, SEARCH & MENU (60%) -->
        <div class="flex-1 flex flex-col h-full overflow-hidden">
            <header class="bg-white px-5 py-4 flex justify-between items-center shadow-sm z-10 shrink-0">
                <div class="flex items-center gap-3">
                    <img src="https://i.ibb.co.com/JW1FFbCz/1780229137561.png" class="w-9 h-9 rounded-xl shadow-sm">
                    <h1 id="pos-title" class="text-xl font-bold text-gray-800 tracking-tight">POS System</h1>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Tombol Meja Aktif (Open Bill) -->
                    <button onclick="openActiveBillsModal()" class="flex items-center gap-1.5 text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-3.5 py-2 rounded-xl hover:bg-amber-100 smooth-transition">
                        <i data-lucide="table" class="w-4 h-4"></i> Meja Aktif
                    </button>
                    <button onclick="syncData()" id="btn-sync" class="flex items-center gap-1 text-xs font-semibold text-indigo-600 bg-indigo-50 px-3 py-2 rounded-xl hover:bg-indigo-100 smooth-transition">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i> Sync
                    </button>
                    <span class="bg-green-100 text-green-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2"><i data-lucide="user" class="w-3 h-3"></i> <span id="kasir-name">Kasir</span></span>
                    <button onclick="logoutKasir()" class="p-2 bg-red-50 text-red-600 rounded-xl hover:bg-red-100 smooth-transition"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                </div>
            </header>

            <!-- Search & Filter Bar -->
            <div class="bg-white px-5 py-3 border-b border-gray-200 shrink-0 flex flex-col sm:flex-row gap-3 justify-between items-center z-10 shadow-sm">
                <div class="flex gap-2 overflow-x-auto w-full sm:w-auto no-scrollbar pb-1" id="filter-buttons">
                    <button id="btn-cat-Semua" onclick="filterMenu('Semua', this)" class="cat-btn bg-indigo-600 text-white shadow-md px-5 py-2 rounded-xl text-sm font-semibold whitespace-nowrap smooth-transition">Semua</button>
                    <button id="btn-cat-Makanan" onclick="filterMenu('Makanan', this)" class="cat-btn bg-gray-100 text-gray-600 hover:bg-gray-200 px-5 py-2 rounded-xl text-sm font-semibold whitespace-nowrap smooth-transition">Makanan</button>
                    <button id="btn-cat-Minuman" onclick="filterMenu('Minuman', this)" class="cat-btn bg-gray-100 text-gray-600 hover:bg-gray-200 px-5 py-2 rounded-xl text-sm font-semibold whitespace-nowrap smooth-transition">Minuman</button>
                    <button id="btn-cat-Snack" onclick="filterMenu('Snack', this)" class="cat-btn bg-gray-100 text-gray-600 hover:bg-gray-200 px-5 py-2 rounded-xl text-sm font-semibold whitespace-nowrap smooth-transition">Snack</button>
                </div>
                <div class="relative w-full sm:w-64">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input type="text" id="search-menu" onkeyup="searchMenu(this.value)" placeholder="Cari menu..." class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-100 text-sm smooth-transition">
                </div>
            </div>

            <!-- Menu Grid -->
            <div id="menu-container" class="flex-1 overflow-y-auto p-5 grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 content-start">
                <!-- Menu Items -->
            </div>
        </div>

        <!-- RIGHT: CART & CHECKOUT (40%) -->
        <div class="w-full md:w-[400px] bg-white border-l border-gray-200 flex flex-col h-full z-20 shadow-[-10px_0_20px_-5px_rgba(0,0,0,0.05)]">
            <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-indigo-50/50 shrink-0">
                <h2 class="font-bold text-indigo-900 flex items-center gap-2 text-lg"><i data-lucide="shopping-cart" class="w-5 h-5 text-indigo-600"></i> Pesanan <span id="cart-count" class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full">0</span></h2>
                <button onclick="clearCart()" class="text-xs text-red-500 font-semibold hover:bg-red-50 px-3 py-1 rounded-lg smooth-transition">Kosongkan</button>
            </div>

            <div class="p-5 border-b border-gray-100 shrink-0 bg-white">
                <label class="text-xs text-gray-500 font-bold uppercase tracking-wider">Meja / Tamu</label>
                <div class="relative mt-2">
                    <i data-lucide="map-pin" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input type="text" id="order-table" placeholder="M-01 / Bawa Pulang" class="w-full pl-9 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-indigo-500 focus:bg-white font-bold text-gray-800 smooth-transition shadow-inner">
                </div>
            </div>

            <div id="cart-container" class="flex-1 overflow-y-auto p-3 bg-gray-50/50">
            </div>

            <div class="p-5 border-t border-gray-200 bg-white shrink-0 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-10">
                <div class="flex justify-between text-sm mb-2 text-gray-500 font-medium"><p>Subtotal</p><p id="cart-subtotal">Rp 0</p></div>
                
                <!-- DROPDOWN DISCOUNT LEVEL (Kolom Baru) -->
                <div class="flex justify-between items-center text-sm mb-2 text-gray-500 font-medium">
                    <p>Discount</p>
                    <select id="cart-discount-select" onchange="renderCart()" class="bg-gray-100 border-none rounded-lg px-2 py-1 outline-none text-xs font-bold text-gray-700">
                        <option value="0" data-id="DISC-00">0% (Tanpa Diskon)</option>
                    </select>
                </div>
                
                <div class="flex justify-between text-sm mb-4 text-gray-500 font-medium"><p>Pajak & Layanan</p><p id="cart-tax">Rp 0</p></div>
                <div class="flex justify-between items-end mb-5 bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                    <p class="text-sm font-bold text-indigo-900">GRAND TOTAL</p>
                    <p id="cart-grandtotal" class="text-2xl font-black text-indigo-700 tracking-tight">Rp 0</p>
                </div>
                
                <div id="payment-buttons" class="grid grid-cols-2 gap-3 mb-3">
                    <button onclick="processOrder('Cash')" class="py-4 bg-emerald-500 text-white rounded-xl font-bold shadow-lg shadow-emerald-200 hover:bg-emerald-600 smooth-transition active:scale-95">Bayar CASH</button>
                    <button onclick="processOrder('QRIS')" class="py-4 bg-blue-500 text-white rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-600 smooth-transition active:scale-95">Bayar QRIS</button>
                </div>
                <button id="btn-save-bill" onclick="processOrder('Open')" class="w-full py-4 bg-slate-800 text-white rounded-xl font-bold shadow-lg shadow-slate-300 hover:bg-slate-900 smooth-transition active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-5 h-5 text-slate-300"></i> Simpan Bill (Open)
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL: DAFTAR MEJA AKTIF (OPEN BILL)       -->
    <!-- ========================================== -->
    <div id="modal-active-bills" class="hidden-screen fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 smooth-transition">
        <div class="bg-white rounded-3xl w-full max-w-2xl p-6 shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center pb-4 border-b border-gray-200">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="table" class="text-amber-600"></i> Daftar Meja Aktif (Open Bill)</h3>
                <button onclick="closeModal('modal-active-bills')" class="p-1.5 bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200 smooth-transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div id="active-bills-container" class="flex-1 overflow-y-auto py-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Daftar Open Bill -->
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); }); }
        lucide.createIcons();

        const STORAGE_API = "MRD_API_URL";
        const STORAGE_USER = "MRD_CASHIER";
        let GAS_URL = localStorage.getItem(STORAGE_API);
        let cashierInfo = JSON.parse(localStorage.getItem(STORAGE_USER));
        
        let configData = {};
        let menuData = [];
        let discountData = []; 
        let filteredData = []; 
        let cart = [];
        let currentCategory = 'Semua';
        let activeOrderId = null; // Menyimpan ID order jika melunasi Open Bill

        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
                setTimeout(() => {
                    splash.classList.add('hidden-screen');
                    checkState();
                }, 500);
            }, 1000); 
        };

        function checkState() {
            if (!GAS_URL) {
                showScreen('activation-screen');
            } else if (!cashierInfo) {
                showScreen('login-screen');
                fetchConfigBg();
            } else {
                showScreen('main-app');
                document.getElementById('kasir-name').innerText = cashierInfo.name;
                initApp();
            }
        }

        function showScreen(id) {
            ['activation-screen', 'login-screen', 'main-app'].forEach(el => document.getElementById(el).classList.add('hidden-screen'));
            document.getElementById(id).classList.remove('hidden-screen');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden-screen'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden-screen'); }

        async function activateSystem() {
            const input = document.getElementById('api-input').value;
            if(!input) return alert("Masukkan URL!");
            const btn = document.getElementById('btn-activate');
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>`;
            lucide.createIcons();
            
            try {
                const res = await fetch(input, { method: 'POST', body: JSON.stringify({ action: 'getConfig' }) });
                const json = await res.json();
                if(json.success) {
                    localStorage.setItem(STORAGE_API, input);
                    GAS_URL = input;
                    window.location.reload();
                } else throw new Error("Gagal");
            } catch (e) {
                alert("URL API tidak valid atau offline!");
                btn.innerHTML = "Aktifkan Perangkat";
            }
        }

        async function fetchConfigBg() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getConfig' }) });
                const json = await res.json();
                if(json.success) document.getElementById('login-resto-name').innerText = json.data["NAMA_PERUSAAN"] || "RESTO";
            } catch(e) {}
        }

        async function loginKasir() {
            const pin = document.getElementById('login-pin').value;
            if(!pin) return;
            const btn = document.getElementById('btn-login');
            btn.innerText = "Memeriksa...";
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'loginPOS', data: { pin: pin } }) });
                const json = await res.json();
                if(json.success) {
                    localStorage.setItem(STORAGE_USER, JSON.stringify(json));
                    window.location.reload();
                } else {
                    alert(json.message);
                    btn.innerText = "Buka Mesin POS";
                }
            } catch (e) {
                alert("Koneksi gagal!");
                btn.innerText = "Buka Mesin POS";
            }
        }

        function logoutKasir() {
            if(confirm("Yakin ingin mengakhiri sesi kasir?")) {
                localStorage.removeItem(STORAGE_USER);
                window.location.reload();
            }
        }

        // --- FETCH & SYNC DATA ---
        async function syncData() {
            const btn = document.getElementById('btn-sync');
            const icon = btn.querySelector('i');
            icon.classList.add('animate-spin');
            
            localStorage.removeItem('localMenu');
            localStorage.removeItem('localConfig');
            localStorage.removeItem('localDiscounts');
            await initApp();
            
            icon.classList.remove('animate-spin');
        }

        async function initApp() {
            const localMenu = localStorage.getItem('localMenu');
            const localConfig = localStorage.getItem('localConfig');
            const localDisc = localStorage.getItem('localDiscounts');
            
            if(localConfig) { configData = JSON.parse(localConfig); applyConfig(); }
            if(localMenu) { 
                menuData = JSON.parse(localMenu); 
                filteredData = menuData;
                renderMenuHTML(filteredData); 
            }
            if(localDisc) { discountData = JSON.parse(localDisc); renderDiscounts(); }

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getMenu' }) });
                const json = await res.json();
                if(json.success) {
                    menuData = json.data;
                    localStorage.setItem('localMenu', JSON.stringify(menuData));
                    if(document.getElementById('search-menu').value === "") {
                        filterMenu(currentCategory, document.getElementById(`btn-cat-${currentCategory}`)); 
                    }
                }
                
                const resConf = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getConfig' }) });
                const jsonConf = await resConf.json();
                if(jsonConf.success) {
                    configData = jsonConf.data;
                    localStorage.setItem('localConfig', JSON.stringify(configData));
                    applyConfig();
                }

                const resDisc = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getDiscounts' }) });
                const jsonDisc = await resDisc.json();
                if(jsonDisc.success) {
                    discountData = jsonDisc.data;
                    localStorage.setItem('localDiscounts', JSON.stringify(discountData));
                    renderDiscounts();
                }
            } catch (e) { console.log("Sedang Offline"); }
        }

        function applyConfig() {
            if(configData["NAMA_PERUSAAN"]) document.getElementById('pos-title').innerText = configData["NAMA_PERUSAAN"];
        }

        function renderDiscounts() {
            const select = document.getElementById('cart-discount-select');
            select.innerHTML = discountData.map(d => `
                <option value="${d.percentage}" data-id="${d.id}">${d.name} (${d.percentage}%)</option>
            `).join('');
        }

        // --- FILTER, SEARCH ---
        function filterMenu(cat, btnElement = null) {
            currentCategory = cat;
            if (btnElement) {
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
                    b.classList.add('bg-gray-100', 'text-gray-600');
                });
                btnElement.classList.remove('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
                btnElement.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
            }
            applyFilters();
        }

        function searchMenu(val) { applyFilters(val.toLowerCase()); }

        function applyFilters(searchStr = "") {
            const keyword = searchStr || document.getElementById('search-menu').value.toLowerCase();
            filteredData = menuData;
            
            if(currentCategory !== 'Semua') { filteredData = filteredData.filter(m => m.category === currentCategory); }
            if(keyword !== "") {
                filteredData = filteredData.filter(m => 
                    m.name.toLowerCase().includes(keyword) || 
                    (m.description && m.description.toLowerCase().includes(keyword))
                );
            }
            
            const container = document.getElementById('menu-container');
            container.style.opacity = '0';
            setTimeout(() => {
                renderMenuHTML(filteredData);
                container.style.opacity = '1';
            }, 200);
        }

        function renderMenuHTML(items) {
            const container = document.getElementById('menu-container');
            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400 smooth-transition"><i data-lucide="search-x" class="w-16 h-16 mb-3 opacity-50"></i><p>Menu tidak ditemukan</p></div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = items.map(item => {
                const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=e0e7ff&color=4f46e5&size=200&font-size=0.33`;
                return `
                <div onclick="addToCart('${item.id}', '${item.name}', ${item.price}, '${item.route}')" class="menu-card bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden cursor-pointer hover:shadow-md">
                    <div class="h-32 bg-gray-100 relative shrink-0 overflow-hidden">
                        <img src="${item.image || fallbackImg}" 
                             onerror="this.onerror=null; this.src='${fallbackImg}';" 
                             class="w-full h-full object-cover transition-transform duration-700 hover:scale-110">
                        <div class="absolute top-2 right-2 bg-black/70 backdrop-blur-sm text-white text-[10px] font-semibold px-2.5 py-1 rounded-lg tracking-wide shadow-sm">${item.category}</div>
                    </div>
                    <div class="p-4 flex flex-col justify-between flex-1">
                        <div>
                            <h3 class="text-[15px] font-bold text-gray-800 line-clamp-2 leading-snug">${item.name}</h3>
                            <p class="text-[11px] text-gray-500 mt-1.5 line-clamp-2 leading-relaxed">${item.description || ''}</p>
                        </div>
                        <p class="text-[15px] font-black text-indigo-600 mt-3 tracking-tight">Rp ${item.price.toLocaleString()}</p>
                    </div>
                </div>
            `}).join('');
            lucide.createIcons();
        }

        // --- RECALL MEJA AKTIF (OPEN BILL) ---
        async function openActiveBillsModal() {
            openModal('modal-active-bills');
            const container = document.getElementById('active-bills-container');
            container.innerHTML = `<div class="col-span-full py-8 text-center text-gray-400 animate-pulse"><p>Menghubungkan ke database...</p></div>`;
            
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "getOpenOrders" }) });
                const json = await res.json();
                
                if (json.success && json.data.length > 0) {
                    container.innerHTML = json.data.map(bill => `
                        <div onclick="recallBill(${JSON.stringify(bill).replace(/"/g, '&quot;')})" class="bg-amber-50 border border-amber-200 hover:bg-amber-100/70 p-4 rounded-2xl cursor-pointer smooth-transition flex justify-between items-center shadow-sm">
                            <div>
                                <h4 class="font-extrabold text-amber-900 text-lg">Meja: ${bill.tableNo}</h4>
                                <p class="text-xs text-amber-700 mt-1">Waktu: ${bill.time} | Items: ${bill.items.length}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-gray-400">Total Tagihan</p>
                                <p class="font-bold text-amber-900">Rp ${bill.totalAmount.toLocaleString()}</p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400"><i data-lucide="bell-off" class="w-12 h-12 mx-auto mb-3 opacity-40"></i><p>Tidak ada Meja Aktif</p></div>`;
                    lucide.createIcons();
                }
            } catch (e) {
                container.innerHTML = `<div class="col-span-full py-8 text-center text-red-500"><p>Gagal memuat data dari server.</p></div>`;
            }
        }

        function recallBill(bill) {
            activeOrderId = bill.orderId; // Kunci ID transaksi yang sedang dilunasi
            document.getElementById('order-table').value = bill.tableNo;
            
            // Rekonstruksi keranjang belanja
            cart = bill.items.map(item => ({
                menuId: item.menuId,
                name: item.name,
                price: item.price,
                qty: item.qty,
                subtotal: item.subtotal,
                notes: item.notes,
                route: item.route
            }));

            // Set Diskon yang tersimpan
            const selectDisc = document.getElementById('cart-discount-select');
            for (let i = 0; i < selectDisc.options.length; i++) {
                if (selectDisc.options[i].getAttribute('data-id') === bill.discountId) {
                    selectDisc.selectedIndex = i;
                    break;
                }
            }

            // Sembunyikan tombol "Simpan Bill (Open)" karena ini sudah berstatus open
            document.getElementById('btn-save-bill').classList.add('hidden-screen');

            renderCart();
            closeModal('modal-active-bills');
        }

        // --- KERANJANG (CART) ---
        function addToCart(id, name, price, route) {
            // Jika sedang melunasi open bill, kunci penambahan menu baru (SOP kasir agar tidak bias)
            if (activeOrderId) {
                if(!confirm("Anda sedang memproses pelunasan Meja Aktif. Tambah menu baru?")) return;
                // Jika setuju tambah menu, batalkan mode pelunasan open bill (buat bill baru)
                activeOrderId = null;
                document.getElementById('btn-save-bill').classList.remove('hidden-screen');
            }

            const exist = cart.find(i => i.menuId === id);
            if(exist) { exist.qty++; exist.subtotal = exist.qty * price; }
            else { cart.push({ menuId: id, name: name, price: price, qty: 1, subtotal: price, notes: '', route: route || 'Kitchen' }); }
            renderCart();
        }

        function updateQty(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty <= 0) cart.splice(index, 1);
            else cart[index].subtotal = cart[index].qty * cart[index].price;
            renderCart();
        }

        function addNote(index) {
            const note = prompt("Catatan (misal: Sedang, Pedas):", cart[index].notes);
            if(note !== null) { cart[index].notes = note; renderCart(); }
        }

        function clearCart() {
            if(confirm("Kosongkan keranjang?")) { 
                cart = []; 
                document.getElementById('order-table').value = ""; 
                activeOrderId = null; // Reset pelunasan
                document.getElementById('btn-save-bill').classList.remove('hidden-screen');
                renderCart(); 
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-container');
            const subtotal = cart.reduce((sum, item) => sum + item.subtotal, 0);
            
            // Hitung Diskon %
            const selectDisc = document.getElementById('cart-discount-select');
            const discPerc = parseFloat(selectDisc.value || 0);
            const discountAmount = (subtotal * discPerc) / 100;
            const netSubtotal = subtotal - discountAmount;

            const taxPerc = parseFloat(configData["PAJAK_PB1"] || 0); 
            const tax = (netSubtotal * taxPerc) / 100;
            const grandTotal = netSubtotal + tax;

            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-subtotal').innerText = "Rp " + subtotal.toLocaleString();
            document.getElementById('cart-tax').innerText = "Rp " + tax.toLocaleString();
            document.getElementById('cart-grandtotal').innerText = "Rp " + grandTotal.toLocaleString();

            if(cart.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-gray-400 smooth-transition"><i data-lucide="shopping-basket" class="w-16 h-16 mb-3 opacity-30"></i><p class="text-sm font-medium">Keranjang Kosong</p></div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = cart.map((item, idx) => `
                <div class="bg-white p-3.5 rounded-2xl border border-gray-100 mb-2.5 shadow-sm smooth-transition hover:shadow-md">
                    <div class="flex justify-between items-start mb-2">
                        <div class="pr-2">
                            <h4 class="text-[13px] font-bold text-gray-800 leading-tight">${item.name}</h4>
                            <p class="text-[13px] text-indigo-600 font-black mt-1">Rp ${item.subtotal.toLocaleString()}</p>
                        </div>
                        <div class="flex items-center bg-gray-50 border border-gray-200 rounded-xl p-0.5 shrink-0 shadow-inner">
                            <button onclick="updateQty(${idx}, -1)" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-red-500 hover:bg-white rounded-lg smooth-transition font-bold"><i data-lucide="minus" class="w-3 h-3"></i></button>
                            <span class="w-7 text-center text-sm font-bold text-gray-800">${item.qty}</span>
                            <button onclick="updateQty(${idx}, 1)" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-green-500 hover:bg-white rounded-lg smooth-transition font-bold"><i data-lucide="plus" class="w-3 h-3"></i></button>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button onclick="addNote(${idx})" class="text-[10px] bg-amber-50 text-amber-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 border border-amber-200 font-semibold hover:bg-amber-100 smooth-transition"><i data-lucide="pen-line" class="w-3 h-3"></i> ${item.notes ? item.notes : "Catatan"}</button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- CHECKOUT & ROUTING PRINTER ---
        async function processOrder(payMethod) {
            if(cart.length === 0) return alert("Keranjang kosong!");
            const tableNo = document.getElementById('order-table').value.trim();
            if(!tableNo) return alert("Mohon isi Nomor Meja!");

            if(!navigator.onLine) return alert("Koneksi Offline. Gagal mengirim ke server.");

            const selectDisc = document.getElementById('cart-discount-select');
            const discountId = selectDisc.options[selectDisc.selectedIndex].getAttribute('data-id');
            const discPerc = parseFloat(selectDisc.value);

            const subtotal = cart.reduce((sum, item) => sum + item.subtotal, 0);
            const discountAmount = (subtotal * discPerc) / 100;
            const netSubtotal = subtotal - discountAmount;
            
            const tax = (netSubtotal * parseFloat(configData["PAJAK_PB1"] || 0)) / 100;
            const grandTotal = netSubtotal + tax;

            let payload = {};
            let endpoint = "placeOrder";

            if (activeOrderId && payMethod !== 'Open') {
                // JALUR PELUNASAN OPEN BILL
                endpoint = "payOpenOrder";
                payload = {
                    action: endpoint,
                    data: {
                        orderId: activeOrderId,
                        paymentMethod: payMethod
                    }
                };
            } else {
                // JALUR PESANAN BARU (Bisa langsung Lunas atau Simpan Open)
                payload = {
                    action: endpoint,
                    data: {
                        tableNo: tableNo,
                        kasirId: cashierInfo.userId,
                        discount: discountId,
                        tax: tax,
                        totalAmount: grandTotal,
                        paymentMethod: payMethod === 'Open' ? '-' : payMethod,
                        orderStatus: payMethod === 'Open' ? 'Open' : 'Paid',
                        items: cart
                    }
                };
            }

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const json = await res.json();
                if(json.success) {
                    let orderIdPrinted = activeOrderId || json.orderId;
                    
                    // JALANKAN ROUTING PRINTER CERDAS (Suhu Custom)
                    executeRoutingPrint(orderIdPrinted, tableNo, payMethod, subtotal, discountAmount, tax, grandTotal);
                    
                    alert(`Transaksi Berhasil! (${payMethod})`);
                    
                    // Reset State
                    cart = [];
                    document.getElementById('order-table').value = "";
                    activeOrderId = null;
                    document.getElementById('btn-save-bill').classList.remove('hidden-screen');
                    renderCart();
                } else {
                    alert("Error dari Server: " + json.message);
                }
            } catch (e) {
                alert("Gagal mengirim pesanan. Server tidak merespon.");
            }
        }

        // =======================================================
        // METODE PRINTER ROUTING (RAWBT SINGLE-JOB SPLIT PRINTING)
        // =======================================================
        function executeRoutingPrint(orderId, table, payMethod, subtotal, discountAmount, tax, grandTotal) {
            const namaResto = configData["NAMA_PERUSAAN"] || "RESTO";
            const alamat = configData["ALAMAT"] || "";
            
            let finalReceipt = "";

            // 1. STRUK UTAMA KASIR (Hanya dicetak jika langsung BAYAR / LUNAS)
            if (payMethod !== "Open") {
                finalReceipt += `[C]<b>${namaResto}</b>\n[C]${alamat}\n[C]--------------------------------\n[L]ID   : ${orderId}\n[L]Meja : ${table}\n[L]Kasir: ${cashierInfo.name}\n[C]--------------------------------\n`;
                cart.forEach(item => {
                    finalReceipt += `[L]<b>${item.name}</b>\n`;
                    if(item.notes) finalReceipt += `[L]  *${item.notes}\n`;
                    finalReceipt += `[L]${item.qty}x ${item.price} [R]${item.subtotal}\n`;
                });
                finalReceipt += `[C]--------------------------------\n[L]Subtotal [R]${subtotal}\n`;
                if(discountAmount > 0) finalReceipt += `[L]Diskon [R]-${discountAmount}\n`;
                if(tax > 0) finalReceipt += `[L]Pajak/Tax [R]${tax}\n`;
                finalReceipt += `[L]<b>TOTAL</b> [R]<b>${grandTotal}</b>\n[C]--------------------------------\n`;
                finalReceipt += `[C]Status : LUNAS (${payMethod})\n[C]Terima Kasih atas Kunjungannya!\n\n\n`;
                
                // Beri garis pemisah potong kertas (Scissors Cut)
                finalReceipt += `[C]- - - - - POTONG DI SINI - - - - -\n\n\n`;
            }

            // 2. STRUK ORDER DAPUR (Hanya mencetak Menu dengan Route 'Kitchen')
            const kitchenItems = cart.filter(item => item.route === "Kitchen");
            if (kitchenItems.length > 0) {
                finalReceipt += `[C]<b>KITCHEN ORDER (DAPUR)</b>\n[L]Meja : <b>${table}</b>\n[L]ID   : ${orderId}\n[L]Jam  : ${new Date().toLocaleTimeString('id-ID')}\n[C]--------------------------------\n`;
                kitchenItems.forEach(item => {
                    finalReceipt += `[L]<b>[ ] ${item.qty}x  ${item.name}</b>\n`;
                    if(item.notes) finalReceipt += `[L]   *Catatan: ${item.notes}\n`;
                    finalReceipt += `[L]--------------------------------\n`;
                });
                finalReceipt += `\n\n\n[C]- - - - - POTONG DI SINI - - - - -\n\n\n`;
            }

            // 3. STRUK ORDER BAR (Hanya mencetak Menu dengan Route 'Bar')
            const barItems = cart.filter(item => item.route === "Bar");
            if (barItems.length > 0) {
                finalReceipt += `[C]<b>BAR ORDER (MINUMAN)</b>\n[L]Meja : <b>${table}</b>\n[L]ID   : ${orderId}\n[L]Jam  : ${new Date().toLocaleTimeString('id-ID')}\n[C]--------------------------------\n`;
                barItems.forEach(item => {
                    finalReceipt += `[L]<b>[ ] ${item.qty}x  ${item.name}</b>\n`;
                    if(item.notes) finalReceipt += `[L]   *Catatan: ${item.notes}\n`;
                    finalReceipt += `[L]--------------------------------\n`;
                });
                finalReceipt += `\n\n\n`;
            }

            // Kirim seluruh gabungan struk ke printer RawBT
            const base64Data = btoa(unescape(encodeURIComponent(finalReceipt)));
            const intentUrl = `intent:base64,${base64Data}#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;`;
            window.location.href = intentUrl;
        }
    </script>
