<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Backoffice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;950&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: transparent; }
        .hidden-screen { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* =========================================================================
         * OVERRIDE TEMA TERANG PREMIUM UNTUK IFRAME ANAK (LIGHT MODE)
         * ========================================================================= */
        body.light-mode {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-mode .text-white {
            color: #0f172a !important;
        }
        body.light-mode .text-slate-300 {
            color: #334155 !important;
        }
        body.light-mode .text-slate-400 {
            color: #475569 !important;
        }
        body.light-mode .text-slate-500 {
            color: #64748b !important;
        }
        body.light-mode .bg-slate-900,
        body.light-mode .bg-slate-900\/40,
        body.light-mode .bg-slate-900\/60 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
        }
        body.light-mode .border-slate-800,
        body.light-mode .border-slate-850 {
            border-color: #cbd5e1 !important;
        }
        body.light-mode table th {
            background-color: #f1f5f9 !important;
            color: #475569 !important;
            border-bottom-color: #cbd5e1 !important;
        }
        body.light-mode table td {
            color: #1e293b !important;
            border-bottom-color: #f1f5f9 !important;
        }
        body.light-mode tr:hover {
            background-color: #f8fafc !important;
        }
        body.light-mode input,
        body.light-mode select,
        body.light-mode textarea {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode input::placeholder {
            color: #94a3b8 !important;
        }
        body.light-mode .bg-slate-950,
        body.light-mode .bg-slate-950\/40 {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
        }
        body.light-mode #modal-form > div {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode #admin-auth-section {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
        }
    </style>
</head>
<body class="text-slate-100 p-2 overflow-y-auto h-full">

    <!-- DETEKSI WARISAN TEMA INDUK SAAS -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>

    <!-- HEADER DATA KARYAWAN -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-4 mb-6">
        <div>
            <h2 class="text-lg font-black text-white uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="users" class="text-amber-500"></i> Daftar Karyawan
            </h2>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">Daftar staf aktif dan jadwal kontrak kerja</p>
        </div>
        <button onclick="openFormModal()" class="w-full sm:w-auto px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-black rounded-xl shadow-lg flex items-center justify-center gap-1.5 transition">
            <i data-lucide="plus" class="w-4 h-4"></i> TAMBAH KARYAWAN
        </button>
    </div>

    <!-- FILTER BAR -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
        <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
            <input type="text" id="search-input" onkeyup="filterUsers()" placeholder="Cari nama atau No WA..." class="w-full pl-9 pr-4 py-2.5 bg-slate-900 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-amber-500">
        </div>
        
        <!-- Dropdown Cabang Dinamis (SaaS) -->
        <select id="filter-area" onchange="filterUsers()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-2.5 outline-none text-xs focus:border-amber-500">
            <option value="">Memuat Cabang...</option>
        </select>

        <select id="filter-status" onchange="filterUsers()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-2.5 outline-none text-xs focus:border-amber-500">
            <option value="">Semua Status Profil</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>
    </div>

    <!-- TABEL KARYAWAN -->
    <div class="bg-slate-900/40 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-800 text-[10px] text-slate-400 uppercase tracking-widest bg-slate-950/40">
                        <th class="py-4 px-4 font-black">Profil Karyawan</th>
                        <th class="py-4 px-4 font-black">Sesi Kerja (Jobdesk)</th>
                        <th class="py-4 px-4 font-black">Sistem Absen (PIN/GPS)</th>
                        <th class="py-4 px-4 font-black">Sisa Kontrak</th>
                        <th class="py-4 px-4 font-black text-right">Aksi</th>
                    </tr>
                </thead>
                <tbody id="user-table-body" class="divide-y divide-slate-850 text-xs">
                    <tr>
                        <td colspan="5" class="py-12 text-center text-slate-500 animate-pulse font-semibold">Mengambil data dari Google Sheets...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL FORM TAMBAH / EDIT KARYAWAN -->
    <div id="modal-form" class="hidden-screen fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 shrink-0 border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="text-sm font-black text-amber-500 uppercase tracking-wider">Tambah Karyawan Baru</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-4 pr-1 text-left">
                <input type="hidden" id="form-user-id">
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Nama Lengkap</label>
                        <input type="text" id="form-name" placeholder="Nama Karyawan" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">PIN Kiosk (4 Angka)</label>
                        <input type="password" id="form-pin" maxlength="4" placeholder="••••" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-center text-white rounded-xl outline-none text-xs focus:border-amber-500 font-bold">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Jabatan (Role)</label>
                        <select id="form-role" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white">
                            <option value="Staff">Staff</option>
                            <option value="Manager">Manager</option>
                            <option value="HRD">HRD</option>
                            <option value="Owner">Owner</option>
                            <option value="administrator">administrator</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Jobdesk Kerja (Multi-Select)</label>
                        <div class="grid grid-cols-2 gap-1.5 bg-slate-950 border border-slate-850 p-2.5 rounded-xl">
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-jobdesk" value="Waiter" class="rounded accent-amber-500 w-3.5 h-3.5"> Waiter
                            </label>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-jobdesk" value="Kasir" class="rounded accent-amber-500 w-3.5 h-3.5"> Kasir
                            </label>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-jobdesk" value="Back office" class="rounded accent-amber-500 w-3.5 h-3.5"> Back office
                            </label>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-jobdesk" value="Manager" class="rounded accent-amber-500 w-3.5 h-3.5"> Manager
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Cabang Kerja (Area)</label>
                        <select id="form-area" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white">
                            <option value="">Memuat cabang...</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">No WhatsApp</label>
                        <input type="tel" id="form-nowa" placeholder="08..." class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Alamat Rumah</label>
                        <input type="text" id="form-alamat" placeholder="Nama Jalan, Kota" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3 bg-slate-950 p-3.5 border border-slate-850 rounded-2xl">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Status Karyawan</label>
                        <select id="form-statususer" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white">
                            <option value="Contract">Contract</option>
                            <option value="Permanent">Permanent</option>
                            <option value="Training">Training</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Mulai Bekerja</label>
                        <input type="date" id="form-joindate" onchange="autoCalculateEndDate()" class="w-full px-2 py-1.5 bg-slate-900 border border-slate-800 text-white rounded-xl outline-none text-[10px]">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Durasi (Bulan)</label>
                        <input type="number" id="form-contract" placeholder="12" onkeyup="autoCalculateEndDate()" onchange="autoCalculateEndDate()" class="w-full px-2 py-1.5 bg-slate-900 border border-slate-800 text-white rounded-xl outline-none text-xs">
                    </div>
                    <div class="col-span-3 mt-2">
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Berakhir Kontrak (Kalkulasi Otomatis)</label>
                        <input type="date" id="form-enddate" class="w-full px-3 py-2 bg-slate-900 border border-slate-850 text-slate-400 rounded-xl outline-none text-xs" readonly>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Status Profil</label>
                        <select id="form-status" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Kunci GPS (Geotag)</label>
                        <select id="form-geotag" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white">
                            <option value="Active">Active (Wajib Radius)</option>
                            <option value="Inactive">Inactive (Bebas Radius)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Foto Profil (Unggah)</label>
                        <input type="file" id="form-foto-file" accept="image/*" onchange="convertPhotoToBase64()" class="w-full text-[10px] text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[10px] file:font-bold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600 file:cursor-pointer bg-slate-950 border border-slate-800 rounded-xl py-1">
                        <input type="hidden" id="form-foto" value="">
                        <input type="hidden" id="form-foto-base64" value="">
                    </div>
                </div>

                <!-- =========================================================================
                 * SAAS ACL: SEKSI PENGATURAN OTORISASI AKSES BACKOFFICE (KHUSUS ADMINISTRATOR)
                 * ========================================================================= -->
                <div id="admin-auth-section" class="hidden-screen bg-slate-950 p-4 border border-slate-850 rounded-2xl space-y-3.5">
                    <p class="text-[10px] font-black text-amber-500 uppercase tracking-widest flex items-center gap-1.5"><i data-lucide="shield-check" class="w-4 h-4 animate-pulse"></i> Otorisasi Akses Backoffice (Admin Only)</p>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Izin Login Backoffice</label>
                            <select id="form-admin-access" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-2 py-2 outline-none text-xs text-white">
                                <option value="OFF">OFF (Tolak Sesi)</option>
                                <option value="ON">ON (Izinkan Sesi)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Daftar Modul yang Boleh Dibuka</label>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-allowed-tabs" value="Users" class="rounded accent-amber-500 w-3.5 h-3.5"> Karyawan
                            </label>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-allowed-tabs" value="Attendance" class="rounded accent-amber-500 w-3.5 h-3.5"> Absensi
                            </label>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-allowed-tabs" value="Menu" class="rounded accent-amber-500 w-3.5 h-3.5"> Data Menu
                            </label>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-allowed-tabs" value="Promo" class="rounded accent-amber-500 w-3.5 h-3.5"> Diskon & Voucher
                            </label>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-allowed-tabs" value="ProdSales" class="rounded accent-amber-500 w-3.5 h-3.5"> Laporan Produk
                            </label>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-allowed-tabs" value="AuditSales" class="rounded accent-amber-500 w-3.5 h-3.5"> Audit & Keuangan
                            </label>
                            <label class="flex items-center gap-1.5 text-[10px] text-slate-300 font-bold cursor-pointer">
                                <input type="checkbox" name="form-allowed-tabs" value="Config" class="rounded accent-amber-500 w-3.5 h-3.5"> Pengaturan Sistem
                            </label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Keterangan / Deskripsi Karyawan</label>
                    <textarea id="form-keterangan" rows="2" placeholder="Manager Operasional..." class="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none text-xs"></textarea>
                </div>
            </div>
            
            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-end gap-2 shrink-0">
                <button onclick="closeModal()" class="px-5 py-2 text-xs font-bold text-slate-400 hover:text-white transition">Batal</button>
                <button onclick="submitUserForm()" id="btn-save" class="px-6 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs rounded-xl shadow-lg transition">SIMPAN DATA</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = localStorage.getItem("MRD_API_URL");
        const adminSession = JSON.parse(localStorage.getItem("MRD_ADMIN_SESSION"));
        const loggedInRole = adminSession && adminSession.role ? adminSession.role.toLowerCase().trim() : "";
        let allUsers = [];

        window.onload = () => {
            if (GAS_URL) {
                fetchUsers();
                loadDynamicAreas();
            }
        };

        // PARSER DATA METADATA OTORISASI SAAS ACL
        function parseKeterangan(keteranganStr) {
            let adminAccess = "OFF";
            let allowedTabs = [];
            let cleanKeterangan = keteranganStr || "";

            if (keteranganStr) {
                const accessMatch = keteranganStr.match(/\[ADMIN_ACCESS:(ON|OFF)\]/);
                if (accessMatch) adminAccess = accessMatch[1];

                const tabsMatch = keteranganStr.match(/\[ALLOWED_TABS:([^\]]+)\]/);
                if (tabsMatch) allowedTabs = tabsMatch[1].split(",");
                
                cleanKeterangan = keteranganStr.replace(/\[ADMIN_ACCESS:(ON|OFF)\]/, "").replace(/\[ALLOWED_TABS:([^\]]+)\]/, "").trim();
                if (cleanKeterangan.endsWith("|")) cleanKeterangan = cleanKeterangan.slice(0, -1).trim();
            }
            return { adminAccess, allowedTabs, cleanKeterangan };
        }

        async function fetchUsers() {
            const container = document.getElementById('user-table-body');
            try {
                const res = await fetch(GAS_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: "getUsers" }) 
                });
                const json = await res.json();
                if (json.success) {
                    allUsers = json.data;
                    renderUsersTable(allUsers);
                } else {
                    container.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-rose-500 font-bold">Error: ${json.message}</td></tr>`;
                }
            } catch (e) {
                container.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-rose-500 font-bold">Koneksi putus ke database!</td></tr>`;
            }
        }

        function renderUsersTable(dataList) {
            const container = document.getElementById('user-table-body');
            if (dataList.length === 0) {
                container.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-600 font-semibold">Karyawan tidak ditemukan</td></tr>`;
                return;
            }

            container.innerHTML = dataList.map(user => {
                const safeFoto = user.foto || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=1e293b&color=f59e0b&size=100`;
                const parsed = parseKeterangan(user.keterangan);

                const sisaKontrakText = user.endDate ? (() => {
                    let endD = new Date(user.endDate);
                    let diffTime = endD - new Date();
                    let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    return diffDays > 0 
                        ? `<span class="text-amber-500 font-bold">${diffDays} Hari</span> (${user.statusUser})`
                        : `<span class="text-rose-500 font-bold">Habis Kontrak</span>`;
                })() : "-";

                const gpsBadge = user.geotag === "Active"
                    ? `<span class="text-emerald-500 flex items-center gap-1 font-semibold text-[10px]"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Lock Radius</span>`
                    : `<span class="text-slate-500 flex items-center gap-1 font-semibold text-[10px]"><i data-lucide="map" class="w-3.5 h-3.5"></i> Bebas Radius</span>`;

                return `
                    <tr class="hover:bg-slate-900/40 transition">
                        <td class="py-4 px-4 flex items-center gap-3">
                            <img src="${safeFoto}" class="w-10 h-10 rounded-xl object-cover border border-slate-800 shrink-0">
                            <div class="text-left min-w-0">
                                <h4 class="font-bold text-white text-xs sm:text-sm capitalize truncate max-w-[120px]">${user.name}</h4>
                                <p class="text-[9px] text-slate-500 font-semibold tracking-wider uppercase mt-0.5">ID: ${user.userId} | ${user.role}</p>
                            </div>
                        </td>
                        <td class="py-4 px-4 text-left">
                            <p class="font-bold text-white uppercase text-[11px]">${user.jobdesk || "-"}</p>
                            <p class="text-[9px] text-slate-500 font-bold mt-0.5"><i data-lucide="map" class="w-3 h-3 inline"></i> ${user.area}</p>
                        </td>
                        <td class="py-4 px-4 text-left">
                            <p class="font-bold text-slate-300">PIN: ${user.pin}</p>
                            <div class="mt-1">${gpsBadge}</div>
                        </td>
                        <td class="py-4 px-4 text-left">${sisaKontrakText}</td>
                        <td class="py-4 px-4 text-right">
                            <button onclick="editUser('${user.userId}')" class="p-2 bg-amber-500/10 text-amber-500 border border-amber-500/20 rounded-lg hover:bg-amber-500 hover:text-slate-950 transition"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
            lucide.createIcons();
        }

        function convertPhotoToBase64() {
            const file = document.getElementById('form-foto-file').files[0];
            const base64Input = document.getElementById('form-foto-base64');
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert("Ukuran berkas melebihi batas 2MB!");
                    document.getElementById('form-foto-file').value = "";
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = function() {
                    base64Input.value = reader.result;
                };
                reader.readAsDataURL(file);
            } else {
                base64Input.value = "";
            }
        }

        function autoCalculateEndDate() {
            const joinDateStr = document.getElementById('form-joindate').value;
            const contractVal = parseInt(document.getElementById('form-contract').value) || 0;
            const endDateInput = document.getElementById('form-enddate');

            if (joinDateStr && contractVal > 0) {
                let joinD = new Date(joinDateStr);
                joinD.setMonth(joinD.getMonth() + contractVal);
                joinD.setDate(joinD.getDate() - 1);

                let yyyy = joinD.getFullYear();
                let mm = String(joinD.getMonth() + 1).padStart(2, '0');
                let dd = String(joinD.getDate()).padStart(2, '0');
                endDateInput.value = `${yyyy}-${mm}-${dd}`;
            } else {
                endDateInput.value = "";
            }
        }

        function filterUsers() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const area = document.getElementById('filter-area').value;
            const status = document.getElementById('filter-status').value;

            let filtered = allUsers.filter(u => {
                const matchQuery = u.name.toLowerCase().includes(query) || u.noWa.includes(query);
                const matchArea = area === "" || u.area === area;
                const matchStatus = status === "" || u.status === status;
                return matchQuery && matchArea && matchStatus;
            });
            renderUsersTable(filtered);
        }

        function openFormModal(userId = null) {
            const modal = document.getElementById('modal-form');
            const title = document.getElementById('modal-title');
            modal.classList.remove('hidden-screen');

            // Kontrol seksi otorisasi jika yang login adalah administrator
            const authSection = document.getElementById('admin-auth-section');
            if (loggedInRole === "administrator") {
                authSection.classList.remove('hidden-screen');
            } else {
                authSection.classList.add('hidden-screen');
            }

            document.getElementById('form-user-id').value = "";
            document.getElementById('form-name').value = "";
            document.getElementById('form-pin').value = "";
            document.getElementById('form-role').value = "Staff";
            document.getElementById('form-jobdesk').value = "Waiter";
            document.getElementById('form-area').value = "";
            document.getElementById('form-nowa').value = "";
            document.getElementById('form-alamat').value = "";
            document.getElementById('form-statususer').value = "Contract";
            document.getElementById('form-joindate').value = "";
            document.getElementById('form-contract').value = "";
            document.getElementById('form-enddate').value = "";
            document.getElementById('form-status').value = "Active";
            document.getElementById('form-geotag').value = "Active";
            document.getElementById('form-foto').value = "";
            document.getElementById('form-foto-file').value = "";
            document.getElementById('form-foto-base64').value = "";
            document.getElementById('form-keterangan').value = "";
            
            // Reset input otorisasi
            document.getElementById('form-admin-access').value = "OFF";
            document.querySelectorAll('input[name="form-allowed-tabs"]').forEach(cb => cb.checked = false);
            // Reset Ceklis Jobdesk
            document.querySelectorAll('input[name="form-jobdesk"]').forEach(cb => cb.checked = false);

            if (userId) {
                title.innerText = "Edit Data Karyawan";
                const u = allUsers.find(x => x.userId === userId);
                if (u) {
                    const parsed = parseKeterangan(u.keterangan);

                    document.getElementById('form-user-id').value = u.userId;
                    document.getElementById('form-name').value = u.name;
                    document.getElementById('form-pin').value = u.pin;
                    document.getElementById('form-role').value = u.role;
                    document.getElementById('form-jobdesk').value = u.jobdesk;
                    document.getElementById('form-area').value = u.area;
                    document.getElementById('form-nowa').value = u.noWa;
                    document.getElementById('form-alamat').value = u.alamat;
                    document.getElementById('form-statususer').value = u.statusUser;
                    document.getElementById('form-joindate').value = u.joinDate;
                    document.getElementById('form-contract').value = u.contract;
                    document.getElementById('form-enddate').value = u.endDate;
                    document.getElementById('form-status').value = u.status;
                    document.getElementById('form-geotag').value = u.geotag;
                    document.getElementById('form-foto').value = u.foto;
                    
                    // Muat nilai keterangan yang bersih & nilai otorisasi
                    document.getElementById('form-keterangan').value = parsed.cleanKeterangan;
                    document.getElementById('form-admin-access').value = parsed.adminAccess;

                    // Nyalakan ceklis modul yang boleh dibuka
                    parsed.allowedTabs.forEach(tab => {
                        const cb = document.querySelector(`input[name="form-allowed-tabs"][value="${tab}"]`);
                        if (cb) cb.checked = true;
                    });

                    // Nyalakan Ceklis Berdasarkan Nilai Terpisah Koma (SaaS EnumList)
                    if (u.jobdesk) {
                        const jds = u.jobdesk.split(",").map(item => item.trim());
                        jds.forEach(jd => {
                            const cb = document.querySelector(`input[name="form-jobdesk"][value="${jd}"]`);
                            if (cb) cb.checked = true;
                        });
                    }
                }
            } else {
                title.innerText = "Tambah Karyawan Baru";
            }
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal-form').classList.add('hidden-screen');
        }

        async function submitUserForm() {
            const name = document.getElementById('form-name').value.trim();
            const pin = document.getElementById('form-pin').value.trim();
            const joinDate = document.getElementById('form-joindate').value;
            const noWa = document.getElementById('form-nowa').value.trim();
            let rawKeterangan = document.getElementById('form-keterangan').value.trim();

            // Kumpulkan nilai kotak centang jobdesk (EnumList)
            const selectedJobdesks = [];
            document.querySelectorAll('input[name="form-jobdesk"]:checked').forEach(cb => {
                selectedJobdesks.push(cb.value);
            });
            const jobdeskValue = selectedJobdesks.join(", ");

            if (!name || !pin || !joinDate || !noWa || selectedJobdesks.length === 0) {
                alert("Lengkapi kolom Nama, PIN, Tanggal Join, No WA, dan pilih minimal 1 Jobdesk!");
                return;
            }

            const saveBtn = document.getElementById('btn-save');
            saveBtn.innerText = "Mengirim...";
            saveBtn.disabled = true;

            // Kumpulkan data otorisasi jika login sebagai administrator
            let adminAccessValue = "OFF";
            let allowedTabsList = [];
            if (loggedInRole === "administrator") {
                adminAccessValue = document.getElementById('form-admin-access').value;
                document.querySelectorAll('input[name="form-allowed-tabs"]:checked').forEach(cb => {
                    allowedTabsList.push(cb.value);
                });
            } else {
                // Jika bukan administrator, pertahankan nilai otorisasi lama agar tidak hilang
                const oldUser = allUsers.find(x => x.userId === document.getElementById('form-user-id').value);
                if (oldUser) {
                    const parsed = parseKeterangan(oldUser.keterangan);
                    adminAccessValue = parsed.adminAccess;
                    allowedTabsList = parsed.allowedTabs;
                    rawKeterangan = parsed.cleanKeterangan;
                }
            }

            // Integrasikan parameter otorisasi ke dalam string kolom Keterangan secara asinkron
            let finalKeterangan = rawKeterangan;
            if (adminAccessValue === "ON" || allowedTabsList.length > 0) {
                finalKeterangan = `${rawKeterangan} | [ADMIN_ACCESS:${adminAccessValue}] [ALLOWED_TABS:${allowedTabsList.join(",")}]`.trim();
                if (finalKeterangan.startsWith("|")) finalKeterangan = finalKeterangan.slice(1).trim();
            }

            const userData = {
                userId: document.getElementById('form-user-id').value,
                name: name,
                pin: pin,
                role: document.getElementById('form-role').value,
                jobdesk: jobdeskValue,
                area: document.getElementById('form-area').value,
                noWa: noWa,
                alamat: document.getElementById('form-alamat').value.trim(),
                statusUser: document.getElementById('form-statususer').value,
                joinDate: joinDate,
                contract: parseInt(document.getElementById('form-contract').value) || "",
                endDate: document.getElementById('form-enddate').value,
                status: document.getElementById('form-status').value,
                geotag: document.getElementById('form-geotag').value,
                foto: document.getElementById('form-foto').value.trim(),
                photoBase64: document.getElementById('form-foto-base64').value,
                keterangan: finalKeterangan
            };

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "saveUser", data: { userData: userData } })
                });
                const json = await res.json();
                if (json.success) {
                    alert(json.message);
                    closeModal();
                    fetchUsers();
                } else {
                    alert("Gagal: " + json.message);
                }
            } catch (e) {
                alert("Kesalahan pengiriman data ke Apps Script.");
            } finally {
                saveBtn.innerText = "SIMPAN DATA";
                saveBtn.disabled = false;
            }
        }

        function editUser(userId) {
            openFormModal(userId);
        }
        
        async function loadDynamicAreas() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "getAvailableAreas" }) });
                const json = await res.json();
                if (json.success) {
                    const areas = json.data;
                    const filterSelect = document.getElementById('filter-area');
                    const formSelect = document.getElementById('form-area');

                    let options = `<option value="">Semua Cabang (Area)</option>`;
                    let formOptions = `<option value="">Pilih Cabang</option>`;

                    areas.forEach(area => {
                        options += `<option value="${area}">${area}</option>`;
                        formOptions += `<option value="${area}">${area}</option>`;
                    });

                    filterSelect.innerHTML = options;
                    formSelect.innerHTML = formOptions;
                }
            } catch (e) { 
                console.error("Gagal memuat daftar cabang SaaS"); 
            }
        }
    </script>
