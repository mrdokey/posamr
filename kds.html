<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KDS - Kitchen Display System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; }
        .hidden-screen { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col select-none text-slate-100 overflow-hidden">

    <!-- HEADER LAYAR MONITOR -->
    <header class="bg-slate-900 px-6 py-4 flex justify-between items-center shrink-0 border-b border-slate-800 z-10 shadow-md">
        <div class="flex items-center gap-3">
            <div id="display-badge-icon" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0">
                <i data-lucide="chef-hat" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 id="display-title" class="text-lg font-black uppercase tracking-wider text-white">DISPLAY DAPUR</h1>
                <p id="display-subtitle" class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">SINKRONISASI REAL-TIME</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="fetchActiveOrders()" class="px-4 py-2.5 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-xs font-bold rounded-xl transition flex items-center gap-1.5" title="Segarkan Antrean">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> SEGARKAN MANUAL
            </button>
            <button onclick="clearServedCache()" class="px-3 py-2.5 bg-rose-950/30 text-rose-400 border border-rose-900/30 text-xs font-bold rounded-xl hover:bg-rose-900/20 transition" title="Reset Cache Sajian Hari Ini">
                <i data-lucide="trash-2" class="w-4 h-4"></i> RESET
            </button>
            <button onclick="exitMonitor()" class="p-2.5 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-rose-500 rounded-xl transition" title="Keluar">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- AREA ANTRIAN KARTU ORDERAN -->
    <main class="flex-1 overflow-x-auto p-6 flex gap-6 items-start no-scrollbar bg-slate-950/40">
        <div id="queue-container" class="flex gap-6 h-full items-start">
            <div class="w-80 bg-slate-900/50 border border-slate-800 rounded-3xl p-12 text-center flex flex-col items-center justify-center gap-3 mx-auto h-[60vh] shrink-0">
                <i data-lucide="loader-2" class="w-10 h-10 text-amber-500 animate-spin"></i>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Menghubungkan ke GAS...</p>
            </div>
        </div>
    </main>

    <script>
        const STORAGE_API = "MRD_API_URL";
        const GAS_URL = localStorage.getItem(STORAGE_API);
        
        let monitorType = "Kitchen"; // Default "Kitchen" atau "Bar"
        let activeOrders = [];
        let pollingInterval = null;

        window.onload = () => {
            // DETEKSI TIPE MONITOR SECARA CERDAS DARI SESSION SSO
            const isBarSession = localStorage.getItem("MRD_BAR_SESSION");
            const isKdsSession = localStorage.getItem("MRD_KDS_SESSION");

            if (isBarSession && !isKdsSession) {
                monitorType = "Bar";
            } else {
                monitorType = "Kitchen";
            }

            setupMonitorUI();
            fetchActiveOrders();

            // Polling data otomatis setiap 20 detik
            pollingInterval = setInterval(fetchActiveOrders, 20000);
        };

        function setupMonitorUI() {
            const title = document.getElementById('display-title');
            const iconContainer = document.getElementById('display-badge-icon');
            const icon = iconContainer.querySelector('i');

            if (monitorType === "Bar") {
                title.innerText = "DISPLAY MONITOR BAR (BDS)";
                iconContainer.className = "w-10 h-10 rounded-xl flex items-center justify-center shrink-0 bg-sky-500/10 text-sky-400 border border-sky-500/20";
                icon.setAttribute('data-lucide', 'glass-water');
            } else {
                title.innerText = "DISPLAY MONITOR DAPUR (KDS)";
                iconContainer.className = "w-10 h-10 rounded-xl flex items-center justify-center shrink-0 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20";
                icon.setAttribute('data-lucide', 'chef-hat');
            }
            lucide.createIcons();
        }

        async function fetchActiveOrders() {
            const container = document.getElementById('queue-container');
            if (!GAS_URL) {
                container.innerHTML = `<div class="p-12 text-center text-rose-500 font-bold">API URL Belum Diaktivasi!</div>`;
                return;
            }

            try {
                // Mengambil history order aktif (Draft/Open/Paid) dari server GAS
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getHistoryOrders", data: { area: "" } })
                });
                const json = await res.json();

                if (json.success) {
                    const incomingOrders = json.data || [];
                    
                    // Filter order hanya yang berstatus Open/Paid (yang butuh dimasak)
                    const pendingOrders = incomingOrders.filter(order => order.status === "Open" || order.status === "Paid");
                    
                    // Deteksi jika ada orderan baru masuk untuk memicu bel
                    if (detectNewOrders(pendingOrders)) {
                        playAlertSound();
                    }

                    activeOrders = pendingOrders;
                    renderQueue();
                }
            } catch (err) {
                console.error("Gagal melakukan sinkronisasi data dapur:", err);
            }
        }

        // Membandingkan data lama vs baru di memori untuk deteksi order baru
        let previousOrderIds = [];
        function detectNewOrders(newList) {
            const currentIds = newList.map(o => o.orderId);
            let hasNew = false;

            if (previousOrderIds.length > 0) {
                currentIds.forEach(id => {
                    if (!previousOrderIds.includes(id)) {
                        hasNew = true;
                    }
                });
            }
            previousOrderIds = currentIds;
            return hasNew;
        }

        // Sintesis suara lonceng panggilan koki (Ding-Dong) secara offline
        function playAlertSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = "sine";
                osc.frequency.setValueAtTime(660, ctx.currentTime); 
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); 
                
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch (e) {}
        }

        function renderQueue() {
            const container = document.getElementById('queue-container');
            const servedList = JSON.parse(localStorage.getItem('served_items_cache') || "[]");

            // Filter item berdasarkan rute cetak (Kitchen vs Bar)
            let filteredQueue = [];

            activeOrders.forEach(order => {
                // Saring item milik order ini sesuai peruntukan layar monitor
                const itemsForThisMonitor = order.items.filter(item => {
                    const matchRoute = monitorType === "Bar" ? item.route === "Bar" : item.route === "Kitchen";
                    const isAlreadyServed = servedList.includes(order.orderId + "-" + item.menuId);
                    return matchRoute && !isAlreadyServed;
                });

                if (itemsForThisMonitor.length > 0) {
                    filteredQueue.push({
                        orderId: order.orderId,
                        time: order.time,
                        tableNo: order.tableNo,
                        waiterName: order.waiterName || "Kasir",
                        items: itemsForThisMonitor
                    });
                }
            });

            if (filteredQueue.length === 0) {
                container.innerHTML = `
                    <div class="w-80 bg-slate-900/40 border border-slate-800 rounded-3xl p-12 text-center flex flex-col items-center justify-center gap-3 h-[40vh] shrink-0">
                        <div class="w-14 h-14 bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center">
                            <i data-lucide="check-circle" class="w-8 h-8"></i>
                        </div>
                        <h4 class="font-bold text-white text-sm uppercase tracking-wider">Antrean Bersih!</h4>
                        <p class="text-[10px] text-slate-500 uppercase font-semibold">Semua hidangan telah disajikan.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Render daftar kartu antrean horizontal
            container.innerHTML = filteredQueue.map(order => {
                return `
                    <div class="w-80 bg-slate-900 border border-slate-800 rounded-3xl p-5 flex flex-col justify-between shrink-0 h-full max-h-[80vh] shadow-xl">
                        <div class="overflow-y-auto no-scrollbar pr-1">
                            <!-- HEADER KARTU -->
                            <div class="flex justify-between items-start border-b border-slate-800 pb-3 mb-4">
                                <div class="text-left">
                                    <h3 class="text-2xl font-black text-amber-500 tracking-tight">${order.tableNo}</h3>
                                    <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">Waiter: ${order.waiterName}</p>
                                </div>
                                <span class="bg-slate-850 text-slate-400 font-bold text-[10px] px-2.5 py-1 rounded-lg">${order.time}</span>
                            </div>

                            <!-- DAFTAR MAKANAN / MINUMAN -->
                            <div class="space-y-3.5 text-left">
                                ${order.items.map(item => {
                                    const noteDisplay = item.notes 
                                        ? `<p class="text-[10px] text-amber-400 font-black mt-1 bg-amber-500/15 border border-amber-500/20 px-2 py-1 rounded-md">* ${item.notes}</p>` 
                                        : '';
                                    return `
                                        <div class="border-b border-slate-800/60 pb-3 last:border-b-0">
                                            <div class="flex justify-between items-start">
                                                <span class="text-2xl font-black text-white shrink-0 mr-3">${item.qty}x</span>
                                                <span class="text-sm font-bold text-slate-200 flex-1 leading-snug uppercase">${item.name}</span>
                                            </div>
                                            ${noteDisplay}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- TOMBOL SAJIKAN (LOCAL CACHE DISMISS) -->
                        <button onclick="serveEntireOrder('${order.orderId}', ${JSON.stringify(order.items).replace(/"/g, '&quot;')})" class="mt-4 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs rounded-2xl flex items-center justify-center gap-1.5 active:scale-95 transition-all shadow-lg shadow-emerald-900/20 shrink-0">
                            <i data-lucide="check" class="w-4 h-4"></i> SAJIKAN PESANAN
                        </button>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        // Menandai hidangan telah disajikan secara lokal (hemat kuota database)
        function serveEntireOrder(orderId, items) {
            let servedList = JSON.parse(localStorage.getItem('served_items_cache') || "[]");

            items.forEach(item => {
                const uniqueKey = orderId + "-" + item.menuId;
                if (!servedList.includes(uniqueKey)) {
                    servedList.push(uniqueKey);
                }
            });

            localStorage.setItem('served_items_cache', JSON.stringify(servedList));
            renderQueue(); // Segarkan tampilan secara instan tanpa loading
        }

        // Mereset cache sajian lokal (biasanya dilakukan saat pergantian shift / hari baru)
        function clearServedCache() {
            if (confirm("Reset seluruh cache sajian lokal hari ini?\n\nSemua hidangan yang disembunyikan akan kembali ke antrean.")) {
                localStorage.removeItem('served_items_cache');
                fetchActiveOrders();
            }
        }

        function exitMonitor() {
            if (confirm("Keluar dari layar monitor display?")) {
                localStorage.removeItem("MRD_BAR_SESSION");
                localStorage.removeItem("MRD_KDS_SESSION");
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
