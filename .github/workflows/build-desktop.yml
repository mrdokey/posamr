name: Build Desktop Exe (No-Bundle)
on:
  push:
    branches:
      - main # Memicu perakitan setiap kali Anda push ke branch main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@v1

      - name: Build Standalone Exe (No Bundle)
        run: tauri build --no-bundle

      # Unggah hasil rakitan .exe langsung ke halaman Actions Artifacts Anda
      - name: Upload Standalone Exe
        uses: actions/upload-artifact@v3
        with:
          name: AMR-Admin-Windows-Exe
          path: src-tauri/target/release/AMR_Admin.exe
