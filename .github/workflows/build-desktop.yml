name: Build Desktop Exe (No-Bundle)
on:
  push:
    branches:
      - main # Memicu perakitan setiap kali Anda push ke branch main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      # Menginstal pustaka lokal dari package.json
      - name: Install Local Dependencies
        run: npm install

      # Menjalankan kompilasi tanpa bundler menggunakan sintaksis Tauri v1 yang benar
      - name: Build Standalone Exe (No Bundle)
        run: npm run tauri build -- --bundles none

      # Unggah hasil rakitan .exe ke halaman Actions Artifacts
      - name: Upload Standalone Exe
        uses: actions/upload-artifact@v4
        with:
          name: AMR-Admin-Windows-Exe
          path: src-tauri/target/release/AMR_Admin.exe