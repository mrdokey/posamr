<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Penjualan Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;950&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: transparent; }
        .hidden-screen { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Tema Terang Pewarisan */
        body.light-mode { color: #0f172a; }
        body.light-mode .bg-slate-900 { background-color: #ffffff; border-color: #cbd5e1; }
        body.light-mode input, body.light-mode select { background-color: #ffffff; border-color: #cbd5e1; color: #0f172a; }
        body.light-mode table th { background-color: #f1f5f9; color: #475569; }
        body.light-mode table td { color: #0f172a; border-color: #cbd5e1; }
        body.light-mode tr:hover { background-color: #f8fafc; }
        body.light-mode .text-white { color: #0f172a; }
    </style>
</head>
<body class="text-slate-100 p-2 overflow-y-auto h-full">

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>

    <!-- HEADER -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-4 mb-6">
        <div>
            <h2 class="text-lg font-black text-white uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="utensils" class="text-amber-500"></i> Kinerja Penjualan Produk
            </h2>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">Laporan harian total porsi lunas dan komplimen yang keluar</p>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
            <button onclick="exportToExcel()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-slate-950 font-black text-xs rounded-xl flex items-center justify-center gap-1.5 transition">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> EKSPOR EXCEL (RANGE)
            </button>
            <button onclick="fetchProductReport()" class="px-4 py-2.5 bg-slate-900 border border-slate-800 hover:bg-slate-800 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- FILTER BAR -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 mb-6 items-end">
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Cari Produk</label>
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                <input type="text" id="search-input" onkeyup="filterReport()" placeholder="Cari nama menu..." class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-amber-500">
            </div>
        </div>
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Cabang (Area)</label>
            <select id="filter-area" onchange="filterReport()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-2 outline-none text-xs focus:border-amber-500">
                <option value="">Memuat Cabang...</option>
            </select>
        </div>
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Kategori</label>
            <select id="filter-category" onchange="filterReport()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-2.5 outline-none text-xs focus:border-amber-500">
                <option value="">Semua Kategori</option>
                <option value="Makanan">Makanan</option>
                <option value="Minuman">Minuman</option>
                <option value="Snack">Snack</option>
            </select>
        </div>
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Dari Tanggal</label>
            <input type="date" id="filter-start-date" onchange="filterReport()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-1.5 outline-none text-xs focus:border-amber-500">
        </div>
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Sampai Tanggal</label>
            <input type="date" id="filter-end-date" onchange="filterReport()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-1.5 outline-none text-xs focus:border-amber-500">
        </div>
    </div>

    <!-- TABEL LAPORAN PRODUK -->
    <div class="bg-slate-900/40 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-800 text-[10px] text-slate-400 uppercase tracking-widest bg-slate-950/40">
                        <th class="py-4 px-4 font-black">Menu Hidangan</th>
                        <th class="py-4 px-4 font-black">Kategori</th>
                        <th class="py-4 px-4 font-black">Porsi Berbayar (Qty)</th>
                        <th class="py-4 px-4 font-black">Porsi Komplimen/FOC (Qty)</th>
                        <th class="py-4 px-4 font-black">Total Porsi Keluar</th>
                        <th class="py-4 px-4 font-black text-right">Subtotal Omset</th>
                    </tr>
                </thead>
                <tbody id="report-body" class="divide-y divide-slate-850 text-xs">
                    <tr>
                        <td colspan="6" class="py-12 text-center text-slate-500 animate-pulse font-semibold">Menganalisis penjualan produk...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GAS_URL = localStorage.getItem("MRD_API_URL");
        let allItems = [];
        let filteredItems = [];

        window.onload = () => {
            if (GAS_URL) {
                // Set default tanggal hari ini di filter pencarian
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('filter-start-date').value = today;
                document.getElementById('filter-end-date').value = today;

                fetchProductReport();
                loadDynamicAreas();
            }
        };

        async function fetchProductReport() {
            const container = document.getElementById('report-body');
            const startDate = document.getElementById('filter-start-date').value;
            const endDate = document.getElementById('filter-end-date').value;
            const area = document.getElementById('filter-area').value;

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: "getProductSalesReport", 
                        data: { area: area, startDate: startDate, endDate: endDate } 
                    })
                });
                const json = await res.json();

                if (json.success) {
                    allItems = json.data;
                    filteredItems = allItems;
                    renderTable(filteredItems);
                } else {
                    container.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-500 font-bold">Gagal: ${json.message}</td></tr>`;
                }
            } catch (err) {
                container.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-500 font-bold">Koneksi putus ke database!</td></tr>`;
            }
        }

        function renderTable(dataList) {
            const container = document.getElementById('report-body');
            if (dataList.length === 0) {
                container.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-600 font-semibold">Tidak ada data penjualan produk</td></tr>`;
                return;
            }

            container.innerHTML = dataList.map(item => `
                <tr class="hover:bg-slate-900/40 transition">
                    <td class="py-4 px-4 flex items-center gap-3">
                        <div class="text-left min-w-0">
                            <h4 class="font-bold text-white text-xs sm:text-sm capitalize">${item.name}</h4>
                            <p class="text-[9px] text-slate-500 font-semibold tracking-wider uppercase mt-0.5">ID: ${item.menuId}</p>
                        </div>
                    </td>
                    <td class="py-4 px-4 text-slate-400 font-bold uppercase text-[10px]">${item.category}</td>
                    <td class="py-4 px-4 text-slate-300 font-bold">${item.qtyPaid}</td>
                    <td class="py-4 px-4 text-amber-500 font-bold">${item.qtyFoc || 0}</td>
                    <td class="py-4 px-4 text-white font-black text-xs">${item.totalQty}</td>
                    <td class="py-4 px-4 text-right text-emerald-400 font-black">Rp ${item.totalRevenue.toLocaleString('id-ID')}</td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function filterReport() {
            // Karena kita melakukan Server-Side Aggregation agar ringan,
            // Kita panggil fetchProductReport langsung saat tanggal/cabang berubah:
            const eventTarget = window.event ? window.event.target.id : "";
            if (eventTarget === "filter-start-date" || eventTarget === "filter-end-date" || eventTarget === "filter-area") {
                fetchProductReport();
                return;
            }

            const query = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('filter-category').value;

            filteredItems = allItems.filter(item => {
                const matchQuery = item.name.toLowerCase().includes(query) || item.menuId.toLowerCase().includes(query);
                const matchCategory = category === "" || item.category === category;
                return matchQuery && matchCategory;
            });
            renderTable(filteredItems);
        }

        async function loadDynamicAreas() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "getAvailableAreas" }) });
                const json = await res.json();
                if (json.success) {
                    const areas = json.data;
                    let options = `<option value="">Semua Cabang (Area)</option>`;
                    areas.forEach(area => { options += `<option value="${area}">${area}</option>`; });
                    document.getElementById('filter-area').innerHTML = options;
                }
            } catch (e) {
                console.error("Gagal memuat cabang");
            }
        }

        function exportToExcel() {
    if (filteredItems.length === 0) {
        alert("Tidak ada data produk untuk diekspor!");
        return;
    }
    
    let csv = "\uFEFF"; // BOM UTF-8
    
    const headers = ["ID Menu", "Nama Menu", "Kategori", "Porsi Berbayar (Qty)", "Porsi Komplimen (Qty)", "Total Porsi Keluar", "Omset Penjualan (Rupiah)"];
    
    function escapeCsvCell(val) {
        if (val === undefined || val === null) return '""';
        let s = val.toString().replace(/"/g, '""');
        return '"' + s + '"';
    }
    
    csv += headers.map(escapeCsvCell).join(",") + "\n";
    
    filteredItems.forEach(item => {
        const row = [
            item.menuId || "",
            item.name || "",
            item.category || "",
            item.qtyPaid !== undefined ? item.qtyPaid : 0,
            item.qtyFoc !== undefined ? item.qtyFoc : 0,
            item.totalQty !== undefined ? item.totalQty : 0,
            item.totalRevenue !== undefined ? item.totalRevenue : 0
        ];
        
        csv += row.map(function(val) {
            return '"' + val.toString().replace(/"/g, '""') + '"';
        }).join(",") + "\n";
    });
    
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    
    const startStr = document.getElementById('filter-start-date').value || "Mulai";
    const endStr = document.getElementById('filter-end-date').value || "Selesai";
    link.setAttribute("download", `Rekap_Penjualan_Produk_AMR_${startStr}_to_${endStr}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
    </script>
</body>
</html>
