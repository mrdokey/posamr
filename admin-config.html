    <script>
        const GAS_URL = localStorage.getItem("MRD_API_URL");
        let allConfigs = [];

        window.onload = () => {
            if (GAS_URL) fetchConfig();
        };

        // 1. TARIK DATA CONFIG DARI GAS
        async function fetchConfig() {
            const container = document.getElementById('config-body');
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getAdminConfig" })
                });
                const json = await res.json();
                if (json.success) {
                    allConfigs = json.data;
                    renderConfigs(allConfigs);
                } else {
                    container.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-rose-500 font-bold">Error: ${json.message}</td></tr>`;
                }
            } catch (e) {
                container.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-rose-500 font-bold">Koneksi putus ke database!</td></tr>`;
            }
        }

        // 2. RENDERING TABEL CONFIG
        function renderConfigs(dataList) {
            const container = document.getElementById('config-body');
            if (dataList.length === 0) {
                container.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-600 font-semibold">Konfigurasi tidak ditemukan</td></tr>`;
                return;
            }

            container.innerHTML = dataList.map(cfg => {
                const areaBadge = cfg.area 
                    ? `<span class="bg-slate-950 border border-slate-850 text-slate-400 text-[10px] px-2 py-0.5 rounded font-bold">${cfg.area}</span>`
                    : `<span class="text-slate-600 font-bold text-[10px]">Semua Cabang</span>`;

                return `
                    <tr class="hover:bg-slate-900/40 transition">
                        <td class="py-4 px-4 font-mono font-black text-amber-500 tracking-wider">${cfg.key}</td>
                        <td class="py-4 px-4 text-slate-400 max-w-xs leading-relaxed text-[11px]">${cfg.description || "Tidak ada deskripsi kegunaan."}</td>
                        <td class="py-4 px-4">${areaBadge}</td>
                        <td class="py-4 px-4 font-bold text-white max-w-xs truncate">${cfg.value}</td>
                        <td class="py-4 px-4 text-right">
                            <button onclick="editConfig('${cfg.key}', '${cfg.area}')" class="p-1.5 bg-amber-500/10 text-amber-500 border border-amber-500/20 rounded-lg hover:bg-amber-500 hover:text-slate-950 transition"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
            lucide.createIcons();
        }

        // 3. LOGIKA PENYARINGAN FILTER

            const query = document.getElementById('search-input').value.toLowerCase();
            let filtered = allLogs.filter(log => {
                return log.userName.toLowerCase().includes(query) || log.userId.includes(query);
            });
            renderLogsTable(filtered);
        }

        function filterConfigs() {
            const query = document.getElementById('search-input').value.toLowerCase();
            let filtered = allConfigs.filter(cfg => {

            });
            renderConfigs(filtered);

        // 4. KONTROL FORM MODAL
        function editConfig(key, areaValue) {
            const modal = document.getElementById('modal-config');
            modal.classList.remove('hidden-screen');

            const cfg = allConfigs.find(x => x.key === key && x.area === areaValue);
            if (cfg) {
                document.getElementById('form-config-key').value = cfg.key;
                document.getElementById('form-config-area').value = cfg.area || "Semua Cabang (Global)";
                document.getElementById('form-config-desc').innerText = cfg.description || "Tidak ada deskripsi kegunaan.";
                document.getElementById('form-config-value').value = cfg.value;
            }
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal-config').classList.add('hidden-screen');
        }

        // 5. PENGIRIMAN DATA UPDATE NILAI KE GAS
        async function submitConfigForm() {
            const key = document.getElementById('form-config-key').value.trim();
            const areaText = document.getElementById('form-config-area').value.trim();
            const value = document.getElementById('form-config-value').value.trim();

            if (!key || value === "") {
                alert("Nilai konfigurasi tidak boleh kosong!");
                return;
            }

            const saveBtn = document.getElementById('btn-save');
            saveBtn.innerText = "Memperbarui...";
            saveBtn.disabled = true;

            // Kembalikan nama area asli jika bernilai global
            const areaValue = areaText.includes("Semua Cabang") ? "" : areaText;

            const configData = {
                key: key,
                area: areaValue,
                value: value
            };

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "saveConfigValue", data: { configData: configData } })
                });
                const json = await res.json();
                if (json.success) {
                    alert(json.message);
                    closeModal();
                    fetchConfig(); // Reload tabel config
                } else {
                    alert("Gagal: " + json.message);
                }
            } catch (e) {
                alert("Kesalahan pengiriman data ke server GAS.");
            } finally {
                saveBtn.innerText = "PERBARUI NILAI";
                saveBtn.disabled = false;
            }
        }
