<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Absensi Karyawan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;950&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: transparent; }
        .hidden-screen { display: none !important; }
        
        /* =========================================================================
         * OVERRIDE TEMA TERANG PREMIUM UNTUK IFRAME ANAK (LIGHT MODE)
         * ========================================================================= */
        body.light-mode {
            background-color: #f8fafc; /* Latar belakang abu terang */
            color: #0f172a; /* Teks gelap */
        }
        body.light-mode .text-white {
            color: #0f172a !important;
        }
        body.light-mode .text-slate-300 {
            color: #334155 !important;
        }
        body.light-mode .text-slate-400 {
            color: #475569 !important;
        }
        body.light-mode .text-slate-500 {
            color: #64748b !important;
        }
        body.light-mode .bg-slate-900,
        body.light-mode .bg-slate-900\/40,
        body.light-mode .bg-slate-900\/60 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
        }
        body.light-mode .border-slate-800,
        body.light-mode .border-slate-850 {
            border-color: #cbd5e1 !important;
        }
        body.light-mode table th {
            background-color: #f1f5f9 !important;
            color: #475569 !important;
            border-bottom-color: #cbd5e1 !important;
        }
        body.light-mode table td {
            color: #1e293b !important;
            border-bottom-color: #f1f5f9 !important;
        }
        body.light-mode tr:hover {
            background-color: #f8fafc !important;
        }
        body.light-mode input,
        body.light-mode select,
        body.light-mode textarea {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode input::placeholder {
            color: #94a3b8 !important;
        }
        body.light-mode .bg-slate-950,
        body.light-mode .bg-slate-950\/40 {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
        }
    </style>
</head>
<body class="text-slate-100 p-2 overflow-y-auto h-full animate-fade-in">

    <!-- DETEKSI WARISAN TEMA INDUK SAAS -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>

    <!-- HEADER -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-4 mb-6">
        <div>
            <h2 class="text-lg font-black text-white uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="clock" class="text-emerald-500"></i> Rekap Absensi Karyawan
            </h2>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">Laporan harian kehadiran dan durasi kerja staf</p>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
            <button onclick="exportToExcel()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-slate-950 font-black text-xs rounded-xl flex items-center justify-center gap-1.5 transition shadow-lg shadow-emerald-600/10">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> TARIK DATA EXCEL
            </button>
            <button onclick="fetchAttendance()" class="px-4 py-2.5 bg-slate-900 border border-slate-800 hover:bg-slate-800 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5" title="Segarkan Data">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- FILTER BAR -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 mb-6 items-end">
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Pencarian Staf</label>
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                <input type="text" id="search-input" onkeyup="filterLogs()" placeholder="Cari nama atau ID..." class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-slate-800 text-white rounded-xl outline-none text-xs focus:border-emerald-500">
            </div>
        </div>
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Cabang (Area)</label>
            <select id="filter-area" onchange="filterLogs()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-2 outline-none text-xs focus:border-emerald-500">
                <option value="">Memuat Cabang...</option>
            </select>
        </div>
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Validasi GPS</label>
            <select id="filter-lokasi" onchange="filterLogs()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-2 outline-none text-xs focus:border-emerald-500">
                <option value="">Semua Lokasi GPS</option>
                <option value="In Radius">In Radius (Aman)</option>
                <option value="Out of Radius">Out of Radius</option>
            </select>
        </div>
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Dari Tanggal</label>
            <input type="date" id="filter-start-date" onchange="filterLogs()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-1.5 outline-none text-xs focus:border-emerald-500">
        </div>
        <div class="flex flex-col">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Sampai Tanggal</label>
            <input type="date" id="filter-end-date" onchange="filterLogs()" class="bg-slate-900 border border-slate-800 text-slate-400 rounded-xl px-3 py-1.5 outline-none text-xs focus:border-emerald-500">
        </div>
    </div>

    <!-- TABEL LOG REKAP -->
    <div class="bg-slate-900/40 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-800 text-[10px] text-slate-400 uppercase tracking-widest bg-slate-950/40">
                        <th class="py-4 px-4 font-black">Tanggal</th>
                        <th class="py-4 px-4 font-black">Nama Karyawan</th>
                        <th class="py-4 px-4 font-black">Jam Masuk (IN)</th>
                        <th class="py-4 px-4 font-black">Jam Pulang (OUT)</th>
                        <th class="py-4 px-4 font-black">Total Jam / Shift</th>
                        <th class="py-4 px-4 font-black">Validasi GPS</th>
                        <th class="py-4 px-4 font-black">Keterangan / Alasan</th>
                    </tr>
                </thead>
                <tbody id="attendance-body" class="divide-y divide-slate-850 text-xs">
                    <tr>
                        <td colspan="7" class="py-12 text-center text-slate-500 animate-pulse font-semibold">Mengambil log kehadiran dari database...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL FOTO ABSEN -->
    <div id="modal-photo" class="hidden-screen fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onclick="closePhotoModal()">
        <div class="max-w-md w-full text-center">
            <img id="modal-img-element" src="" class="max-h-[70vh] mx-auto rounded-2xl border-4 border-slate-800 object-cover shadow-2xl">
            <p class="text-xs text-slate-400 mt-4 uppercase tracking-widest font-bold">Ketuk Di Mana Saja Untuk Menutup</p>
        </div>
    </div>

    <script>
        const GAS_URL = localStorage.getItem("MRD_API_URL");
        let allLogs = [];
        let filteredLogs = [];

        window.onload = () => {
            if (GAS_URL) {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('filter-start-date').value = today;
                document.getElementById('filter-end-date').value = today;

                fetchAttendance();
                loadDynamicAreas();
            }
        };

        async function fetchAttendance() {
            const container = document.getElementById('attendance-body');
            try {
                const resAttLogs = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getAttendanceLogs" })
                });
                const attJson = await resAttLogs.json();

                if (attJson.success) {
                    allLogs = attJson.data;
                    filteredLogs = allLogs;
                    renderLogsTable(filteredLogs);
                } else {
                    container.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-rose-500 font-bold">Gagal: ${attJson.message}</td></tr>`;
                }
            } catch (err) {
                container.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-rose-500 font-bold">Koneksi putus ke database!</td></tr>`;
            }
        }

        function renderLogsTable(dataList) {
    const container = document.getElementById('attendance-body');
    if (dataList.length === 0) {
        container.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-600 font-semibold">Tidak ada log absensi yang cocok</td></tr>`;
        return;
    }

    container.innerHTML = dataList.map(log => {
        const checkInPhoto = log.photoIn 
            ? `<button onclick="viewPhoto('${log.photoIn}')" class="text-emerald-400 font-bold hover:underline flex items-center gap-1"><i data-lucide="image" class="w-3.5 h-3.5 animate-pulse"></i> ${log.timeIn}</button>`
            : `<span class="text-slate-500">${log.timeIn}</span>`;

        const checkOutPhoto = log.photoOut 
            ? `<button onclick="viewPhoto('${log.photoOut}')" class="text-rose-400 font-bold hover:underline flex items-center gap-1"><i data-lucide="image" class="w-3.5 h-3.5 animate-pulse"></i> ${log.timeOut}</button>`
            : `<span class="text-slate-500">${log.timeOut || "-"}</span>`;

        const gpsStatusBadge = log.statusLokasi === "In Radius"
            ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[9px] px-2 py-0.5 rounded-full font-bold">In Radius</span>`
            : `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[9px] px-2 py-0.5 rounded-full font-bold">Out of Radius</span>`;

        // GENERATOR TOMBOL GPS TERPISAH (IN VS OUT)
        let mapButtons = [];
        
        // 1. Tombol Map untuk Absen Masuk (IN)
        if (log.latLongIn && log.latLongIn.trim() !== "") {
            mapButtons.push(`
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(log.latLongIn)}" target="_blank" class="inline-flex items-center gap-1 text-[9px] bg-slate-900 border border-slate-800 hover:bg-slate-800 text-emerald-400 font-black px-2 py-1 rounded-lg transition-all" title="Lokasi Absen Masuk (IN)">
                    <i data-lucide="map-pin" class="w-3 h-3 text-emerald-400"></i> MAP IN
                </a>
            `);
        }
        
        // 2. Tombol Map untuk Absen Pulang (OUT)
        if (log.latLongOut && log.latLongOut.trim() !== "") {
            mapButtons.push(`
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(log.latLongOut)}" target="_blank" class="inline-flex items-center gap-1 text-[9px] bg-slate-900 border border-slate-800 hover:bg-slate-800 text-rose-400 font-black px-2 py-1 rounded-lg transition-all" title="Lokasi Absen Pulang (OUT)">
                    <i data-lucide="map-pin" class="w-3 h-3 text-rose-400"></i> MAP OUT
                </a>
            `);
        }

        // Gabungkan tombol dalam satu baris flexbox
        const mapButtonsHtml = mapButtons.length > 0 
            ? `<div class="flex flex-wrap gap-1.5 mt-1.5">${mapButtons.join('')}</div>`
            : "";

        const cleanKeterangan = log.keterangan || "-";
        const isIzin = cleanKeterangan.includes("[IZIN]") || cleanKeterangan.includes("Pulang Cepat");
        const keteranganDisplay = isIzin 
            ? `<span class="text-amber-500 font-bold">${cleanKeterangan}</span>`
            : `<span class="text-slate-300">${cleanKeterangan}</span>`;

        return `
            <tr class="hover:bg-slate-900/40 transition">
                <td class="py-4 px-4 font-semibold text-slate-300">${log.date}</td>
                <td class="py-4 px-4">
                    <p class="font-bold text-white text-xs sm:text-sm capitalize">${log.userName}</p>
                    <p class="text-[9px] text-slate-500 font-semibold tracking-wider mt-0.5">ID: ${log.userId} | <span class="text-amber-500 font-bold uppercase">${log.userJobdesk || "-"}</span></p>
                </td>
                <td class="py-4 px-4">${checkInPhoto}</td>
                <td class="py-4 px-4">${checkOutPhoto}</td>
                <td class="py-4 px-4 text-left">
                    <p class="font-bold text-white">${log.duration || "-"}</p>
                    <p class="text-[9px] text-slate-500 font-bold mt-0.5">${log.statusShift}</p>
                </td>
                <td class="py-4 px-4">
                    <div class="flex flex-col items-start">
                        ${gpsStatusBadge}
                        ${mapButtonsHtml}
                    </div>
                </td>
                <td class="py-4 px-4 max-w-xs truncate" title="${cleanKeterangan}">${keteranganDisplay}</td>
            </tr>
        `;
    }).join('');
    lucide.createIcons();
}

        function filterLogs() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const area = document.getElementById('filter-area').value;
            const lokasi = document.getElementById('filter-lokasi').value;
            const startDateStr = document.getElementById('filter-start-date').value;
            const endDateStr = document.getElementById('filter-end-date').value;

            filteredLogs = allLogs.filter(log => {
                const matchQuery = log.userName.toLowerCase().includes(query) || log.userId.includes(query);
                
                const matchArea = area === "" || 
                    (log.statusShift && log.statusShift.toLowerCase().includes(area.toLowerCase())) || 
                    (log.area && log.area.toLowerCase().includes(area.toLowerCase()));
                
                const matchLokasi = lokasi === "" || log.statusLokasi === lokasi;
                
                let matchDate = true;
                if (log.date) {
                    const logTime = new Date(log.date).getTime();
                    
                    if (startDateStr) {
                        const startTime = new Date(startDateStr).getTime();
                        if (logTime < startTime) matchDate = false;
                    }
                    if (endDateStr) {
                        const endTime = new Date(endDateStr).getTime();
                        if (logTime > endTime) matchDate = false;
                    }
                }
                
                return matchQuery && matchArea && matchLokasi && matchDate;
            });
            renderLogsTable(filteredLogs);
        }

        function exportToExcel() {
    if (filteredLogs.length === 0) {
        alert("Tidak ada data absensi untuk diekspor!");
        return;
    }
    
    let csv = "\uFEFF"; // BOM UTF-8 agar Excel & WPS mengenali karakter huruf khusus dengan baik
    
    // Header tabel dibungkus kutip ganda sesuai standar RFC 4180
    const headers = ["Tanggal", "ID Karyawan", "Nama Karyawan", "Jobdesk Kerja", "Jam Masuk (IN)", "Foto Masuk (URL)", "Jam Pulang (OUT)", "Foto Pulang (URL)", "Durasi Kerja", "Shift Kerja", "Status Geotag", "Keterangan / Alasan"];
    
    // Helper untuk membungkus data dalam kutip ganda secara aman (anti jebol)
    function escapeCsvCell(val) {
        if (val === undefined || val === null) return '""';
        let s = val.toString().replace(/"/g, '""'); // Ubah tanda " tunggal di dalam teks menjadi "" ganda
        return '"' + s + '"';
    }
    
    // Gabungkan header menggunakan pembatas koma (,)
    csv += headers.map(escapeCsvCell).join(",") + "\n";
    
    // Gabungkan baris data secara aman
    filteredLogs.forEach(log => {
        const row = [
            log.date || "",
            log.userId || "",
            log.userName || "",
            log.userJobdesk || "-", 
            log.timeIn || "",
            log.photoIn || "-", 
            log.timeOut || "-",
            log.photoOut || "-", 
            log.duration || "-",
            log.statusShift || "SHIFT OPEN",
            log.statusLokasi || "In Radius",
            log.keterangan || ""
        ];
        
        csv += row.map(function(val) {
            return '"' + val.toString().replace(/"/g, '""') + '"';
        }).join(",") + "\n";
    });
    
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    
    const startStr = document.getElementById('filter-start-date').value || "Mulai";
    const endStr = document.getElementById('filter-end-date').value || "Selesai";
    link.setAttribute("download", `Rekap_Absensi_AMR_${startStr}_to_${endStr}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

        function viewPhoto(url) {
            const modal = document.getElementById('modal-photo');
            const img = document.getElementById('modal-img-element');
            img.src = url;
            modal.classList.remove('hidden-screen');
        }

        function closePhotoModal() {
            document.getElementById('modal-photo').classList.add('hidden-screen');
        }

        async function loadDynamicAreas() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "getAvailableAreas" }) });
                const json = await res.json();
                if (json.success) {
                    const areas = json.data;
                    let options = `<option value="">Semua Cabang (Area)</option>`;
                    areas.forEach(area => { options += `<option value="${area}">${area}</option>`; });
                    document.getElementById('filter-area').innerHTML = options;
                }
            } catch (e) {
                console.error("Gagal memuat cabang");
            }
        }
    </script>
</body>
</html>
