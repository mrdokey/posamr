<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Pelayan AMR</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/JW1FFbCz/1780229137561.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* KUNCI ANTI-ZOOM DI HP PELAYAN */
        button, input, select { touch-action: manipulation; }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; overflow: hidden; }
        .hidden-screen { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .smooth-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-card:active { transform: scale(0.95); opacity: 0.8; }
        .fade-out { animation: fadeOut 0.5s forwards; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col select-none text-slate-100">

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 bg-[#0f172a] z-[100] flex flex-col items-center justify-center smooth-transition">
        <img src="https://i.ibb.co.com/JW1FFbCz/1780229137561.png" alt="Loading" class="w-32 animate-pulse mb-4">
        <p class="text-slate-300 text-sm font-semibold tracking-widest animate-bounce">MEMUAT LAYANAN PELAYAN...</p>
    </div>

    <!-- 2. SCREEN LOGIN PELAYAN -->
    <div id="login-screen" class="hidden-screen fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4 smooth-transition">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-sm p-8 text-center">
            <img src="https://i.ibb.co.com/JW1FFbCz/1780229137561.png" class="w-24 h-24 mx-auto mb-4">
            <h2 class="text-xl font-black text-amber-500 mb-6 uppercase tracking-widest">AMR ORDER</h2>
            <h3 class="text-2xl font-bold text-white mb-2">Login Pelayan</h3>
            <p class="text-xs text-slate-400 mb-6">Masukkan PIN 4 Angka Anda</p>
            
            <div class="flex gap-4 justify-center mb-8">
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
                <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 bg-transparent transition-all"></span>
            </div>

            <!-- Input Hidden untuk menampung PIN -->
            <input type="password" id="login-pin" class="hidden-screen">

            <!-- Virtual Numpad -->
            <div class="grid grid-cols-3 gap-4 w-full max-w-xs mx-auto mb-4 text-white">
                <button onclick="pressNum('1')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">1</button>
                <button onclick="pressNum('2')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">2</button>
                <button onclick="pressNum('3')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">3</button>
                <button onclick="pressNum('4')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">4</button>
                <button onclick="pressNum('5')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">5</button>
                <button onclick="pressNum('6')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">6</button>
                <button onclick="pressNum('7')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">7</button>
                <button onclick="pressNum('8')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">8</button>
                <button onclick="pressNum('9')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">9</button>
                <button onclick="clearPin()" class="h-16 rounded-2xl bg-red-950/40 text-red-500 font-bold text-sm active:scale-95 smooth-transition">CLEAR</button>
                <button onclick="pressNum('0')" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-2xl active:scale-95 smooth-transition">0</button>
                <button onclick="backspacePin()" class="h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-lg active:scale-95 smooth-transition flex items-center justify-center text-amber-500"><i data-lucide="delete" class="w-6 h-6"></i></button>
            </div>
            <p id="login-status" class="text-sm text-amber-500 mt-4 font-bold h-4"></p>
            
            <!-- PERBAIKAN: Tombol Reset Sesi Ditambahkan -->
            <button onclick="resetLicense()" class="text-[10px] text-red-500 mt-4 hover:underline uppercase font-bold tracking-widest">Hapus Sesi & Reset Browser</button>
        </div>
    </div>

    <!-- 3. MAIN APPLICATION (MURNI PORTRAIT UNTUK HP PELAYAN) -->
    <div id="main-app" class="hidden-screen h-full w-full max-w-md mx-auto flex flex-col bg-slate-900 border-x border-slate-800 relative smooth-transition">
        
        <!-- Header -->
        <header class="bg-slate-950 px-5 py-4 flex justify-between items-center z-10 shrink-0 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co.com/JW1FFbCz/1780229137561.png" class="w-8 h-8 rounded-lg">
                <h1 id="pos-title" class="text-md font-black text-amber-500">AMR ORDER</h1>
            </div>

            <!-- FILE: order.html (Seksi Header Kanan) -->
            <div class="flex items-center gap-2">
                <span class="bg-amber-500/10 text-amber-500 px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1.5 border border-amber-500/20"><i data-lucide="user" class="w-3 h-3"></i> <span id="kasir-name">Waiter</span></span>
                
                <!-- TOMBOL BARU: KEMBALI KE ABSENSI -->
                <button onclick="window.location.href='index.html'" class="p-2 bg-slate-800 text-amber-400 rounded-lg hover:bg-slate-700 transition"><i data-lucide="clock" class="w-4 h-4"></i></button>
                
                <button onclick="logoutKasir()" class="p-2 bg-red-950/40 text-red-500 rounded-lg hover:bg-red-950/60 transition"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
        </header>

        <!-- Search & Filter Bar -->
        <div class="bg-slate-900 px-4 py-3 border-b border-slate-800 shrink-0 flex flex-col gap-3 shadow-md z-10">
            <div class="relative w-full">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                <input type="text" id="search-menu" onkeyup="searchMenu(this.value)" placeholder="Cari menu makanan/minuman..." class="w-full pl-9 pr-4 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none focus:border-amber-500 text-xs smooth-transition">
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar" id="filter-buttons">
                <button id="btn-cat-Semua" onclick="filterMenu('Semua', this)" class="cat-btn bg-amber-500 text-slate-900 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap smooth-transition">Semua</button>
                <button id="btn-cat-Makanan" onclick="filterMenu('Makanan', this)" class="cat-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap smooth-transition">Makanan</button>
                <button id="btn-cat-Minuman" onclick="filterMenu('Minuman', this)" class="cat-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap smooth-transition">Minuman</button>
                <button id="btn-cat-Snack" onclick="filterMenu('Snack', this)" class="cat-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap smooth-transition">Snack</button>
            </div>
        </div>

        <!-- Menu Grid (2 Kolom pas untuk HP) -->
        <!-- PERBAIKAN: Menambahkan items-stretch agar tinggi card seragam -->
        <div id="menu-container" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 gap-4 content-start items-stretch pb-24">
            <!-- Loader -->
            <div class="animate-pulse bg-slate-800 h-32 rounded-xl"></div>
            <div class="animate-pulse bg-slate-800 h-32 rounded-xl"></div>
        </div>

        <!-- 4. TOMBOL KERANJANG MELAYANG (MARKETPLACE STYLE) -->
        <div id="mobile-cart-trigger" class="fixed bottom-6 left-4 right-4 z-30 hidden-screen smooth-transition max-w-sm mx-auto">
            <button onclick="toggleMobileCart()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 py-3.5 rounded-2xl font-black shadow-2xl flex justify-between items-center px-5 active:scale-95 smooth-transition">
                <div class="flex items-center gap-2 text-sm">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Tinjau Order (<span id="mobile-cart-count">0</span>)</span>
                </div>
                <span id="mobile-cart-total" class="text-xs font-black bg-slate-950 text-amber-500 px-2.5 py-1 rounded-lg">Rp 0</span>
            </button>
        </div>

        <!-- 5. BOTTOM SHEET: GAYA KERANJANG MELUNCUR (SLIDE UP) -->
        <div id="cart-panel" class="hidden fixed inset-0 bg-black/60 z-[45] flex flex-col justify-end smooth-transition">
            <!-- Area klik untuk menutup -->
            <div onclick="toggleMobileCart()" class="flex-1"></div>
            
            <div class="bg-slate-900 border-t border-slate-800 rounded-t-[32px] p-5 shadow-2xl flex flex-col max-h-[80vh] w-full max-w-md mx-auto">
                <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-4"></div>
                
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-black text-amber-500 text-lg flex items-center gap-2"><i data-lucide="shopping-basket"></i> Detail Pesanan</h3>
                    <button onclick="clearCart()" class="text-xs text-red-500 font-bold hover:underline">Hapus Semua</button>
                </div>

                <div class="mb-4">
                    <label class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Nomor Meja</label>
                    <input type="text" id="order-table" placeholder="Contoh: Meja 12" class="w-full mt-1.5 px-3 py-2.5 bg-slate-950 border border-slate-800 text-white rounded-xl outline-none focus:border-amber-500 font-black text-sm text-center">
                </div>

                <!-- Scrollable Item List -->
                <div id="cart-container" class="flex-1 overflow-y-auto space-y-3 pr-1">
                    <!-- Items -->
                </div>

                <!-- Checkout Total -->
                <div class="border-t border-slate-800 mt-4 pt-4">
                    <div class="flex justify-between items-end mb-4 bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Belanja</p>
                        <p id="cart-grandtotal" class="text-2xl font-black text-amber-500">Rp 0</p>
                    </div>
                    <button onclick="sendOrderToCashier()" id="btn-send" class="w-full py-4 bg-emerald-500 text-slate-950 rounded-xl font-black shadow-lg shadow-emerald-500/10 hover:bg-emerald-600 smooth-transition active:scale-95 flex items-center justify-center gap-2">
                        <i data-lucide="send" class="w-5 h-5"></i> <span>KIRIM KE KASIR (DRAFT)</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- 6. SCREEN SUCCESS (AUTO-RESET) -->
    <div id="success-screen" class="hidden-screen fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 smooth-transition">
        <div class="text-center">
            <div class="w-20 h-20 bg-emerald-500/10 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check" class="w-10 h-10 text-emerald-500"></i>
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight">Order Terkirim!</h2>
            <p class="text-slate-400 text-sm mt-2">Pesanan meja berhasil dikirim ke Kasir Utama.</p>
            <p class="text-[10px] text-amber-500/60 uppercase tracking-widest mt-8 animate-pulse">Layar reset otomatis dalam 3 detik...</p>
        </div>
    </div>

    <script src="waiter.js?v=2"></script>
</body>
</html>
